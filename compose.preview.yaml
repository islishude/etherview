name: etherview-preview

x-etherview-app-env: &etherview-app-env
  ETHERVIEW_DATABASE_URL: postgres://etherview:${POSTGRES_PASSWORD:-etherview-dev-only}@postgres:5432/etherview?sslmode=disable
  ETHERVIEW_DATABASE_READ_URL: ${ETHERVIEW_DATABASE_READ_URL:-}
  # Keep authoritative HTTP polling and add a newHeads wake hint so locally
  # mined blocks do not wait for the normal polling interval.
  ETHERVIEW_RPC_URLS: ${ETHERVIEW_RPC_URLS:-http://geth:8545,ws://geth:8546}
  ETHERVIEW_CHAIN_GENESIS_FILE: /config/genesis.json
  ETHERVIEW_SERVER_ADDRESS: 0.0.0.0:8080
  ETHERVIEW_SERVER_METRICS_ADDRESS: 0.0.0.0:9090
  ETHERVIEW_LOG_FORMAT: text
  ETHERVIEW_SYNC_PROGRESS_LOG_INTERVAL:
  # A value-less override preserves the checked-in gateway unless the caller
  # explicitly selects another SSRF-validated public HTTPS endpoint.
  ETHERVIEW_METADATA_IPFS_GATEWAY:

x-etherview-api-env: &etherview-api-env
  <<: *etherview-app-env
  ETHERVIEW_SESSION_PEPPER: "NOT_A_SECRET_PEPPER_250e1b7feee4"
  ETHERVIEW_VERIFICATION_WORKER_COUNT:
  ETHERVIEW_VERIFICATION_NODE_PATH:
  ETHERVIEW_VERIFICATION_WRAPPER_PATH:
  ETHERVIEW_VERIFICATION_MANIFEST_PATH:
  ETHERVIEW_VERIFICATION_GEAS_PATH:
  # Docker Desktop fake-IP DNS maps public compiler hosts into 198.18/15.
  # This Preview-only escape hatch retains exact HTTPS-origin, TLS, size, and
  # SHA-256 validation and is deliberately absent from every other role.
  ETHERVIEW_VERIFICATION_UNSAFE_ALLOW_PRIVATE_DOWNLOAD_NETWORKS: "true"

x-etherview-service: &etherview-service
  image: ${ETHERVIEW_IMAGE:-etherview:local}
  build:
    context: .
    target: production
  environment: *etherview-app-env
  volumes:
    - ${ETHERVIEW_CONFIG_FILE:-./deploy/preview.config.yaml}:/etc/etherview/config.yaml:ro
    - ${ETHERVIEW_GENESIS_FILE:-./deploy/preview.genesis.json}:/config/genesis.json:ro

x-etherview-healthcheck: &etherview-healthcheck
  test: ["CMD", "/etherview", "healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 34
  start_period: 10s

x-etherview-runtime-depends-on: &etherview-runtime-depends-on
  postgres:
    condition: service_healthy
  migration:
    condition: service_completed_successfully
  geth:
    condition: service_started

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: etherview
      POSTGRES_USER: etherview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etherview-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etherview -d etherview"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  geth:
    image: ${GETH_IMAGE:-ethereum/client-go:v1.17.5}
    entrypoint: ["/bin/sh", "/usr/local/bin/etherview-geth-entrypoint.sh"]
    command:
      - --dev
      - --dev.period=5
      - --gcmode=archive
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,debug,txpool,dev
      - --http.corsdomain=*
      - --http.vhosts=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=eth,net,web3,debug,txpool,dev
      - --ws.origins=*
      - --miner.pending.feeRecipient
      - "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
    volumes:
      - geth-data:/gethdata
      - ./deploy/geth-entrypoint.sh:/usr/local/bin/etherview-geth-entrypoint.sh:ro
      - ${GETH_GENESIS_FILE:-./deploy/preview.genesis.json}:/config/genesis.json:ro
    ports:
      - "${GETH_HTTP_PORT:-8545}:8545"
      - "${GETH_WS_PORT:-8546}:8546"
    restart: unless-stopped

  migration:
    <<: *etherview-service
    command: ["migrate", "up", "--config=/etc/etherview/config.yaml"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *etherview-service
    command: ["serve", "--roles=api", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *etherview-api-env
      ETHERVIEW_ROLES: api
      ETHERVIEW_SERVER_TLS_CERT_FILE: /run/etherview-tls/tls.crt
      ETHERVIEW_SERVER_TLS_KEY_FILE: /run/etherview-tls/tls.key
    volumes:
      - ${ETHERVIEW_CONFIG_FILE:-./deploy/preview.config.yaml}:/etc/etherview/config.yaml:ro
      - ${ETHERVIEW_GENESIS_FILE:-./deploy/preview.genesis.json}:/config/genesis.json:ro
      - ./.local/preview-tls/tls.crt:/run/etherview-tls/tls.crt:ro
      - ./.local/preview-tls/tls.key:/run/etherview-tls/tls.key:ro
      - compiler-cache:/var/lib/etherview/compilers
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on: *etherview-runtime-depends-on
    healthcheck: *etherview-healthcheck
    ports:
      - "${ETHERVIEW_PORT:-8080}:8080"
      - "${ETHERVIEW_METRICS_PORT:-9090}:9090"
    restart: unless-stopped

  sync:
    <<: *etherview-service
    command: ["serve", "--roles=sync", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *etherview-app-env
      ETHERVIEW_ROLES: sync
    depends_on: *etherview-runtime-depends-on
    healthcheck: *etherview-healthcheck
    restart: unless-stopped

  enrich:
    <<: *etherview-service
    command: ["serve", "--roles=enrich", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *etherview-app-env
      ETHERVIEW_ROLES: enrich
    depends_on: *etherview-runtime-depends-on
    healthcheck: *etherview-healthcheck
    restart: unless-stopped

  trace:
    <<: *etherview-service
    command: ["serve", "--roles=trace", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *etherview-app-env
      ETHERVIEW_ROLES: trace
    depends_on: *etherview-runtime-depends-on
    healthcheck: *etherview-healthcheck
    restart: unless-stopped

  metadata:
    <<: *etherview-service
    command:
      ["serve", "--roles=metadata", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *etherview-app-env
      ETHERVIEW_ROLES: metadata
    depends_on: *etherview-runtime-depends-on
    healthcheck: *etherview-healthcheck
    restart: unless-stopped

  maintenance:
    <<: *etherview-service
    command:
      ["serve", "--roles=maintenance", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *etherview-app-env
      ETHERVIEW_ROLES: maintenance
    depends_on: *etherview-runtime-depends-on
    healthcheck: *etherview-healthcheck
    restart: unless-stopped

volumes:
  postgres-data:
  geth-data:
  compiler-cache:
