server:
  address: 0.0.0.0:8080
  metrics_address: 0.0.0.0:9090
  public_url: https://explorer.example.com
  shutdown_timeout: 20s
  read_timeout: 15s
  write_timeout: 30s

chain:
  id: 1
  genesis_hash: "0xd4e56740f876aef8c010b86a40d5f56745a118d0906a34e69aec8c0db1cb8fa3"
  # Optional absolute path to a mounted standard Genesis JSON. When supplied,
  # its block hash and allocation state root are verified before account import.
  # Mutually exclusive with genesis_url.
  genesis_file: ""
  # Optional public HTTPS URL for a standard Genesis JSON. Credentials, query
  # parameters, fragments, redirects, non-standard ports, and private network
  # targets are rejected. Mutually exclusive with genesis_file.
  genesis_url: ""
  # Optional lowercase SHA-256 of the exact remote response bytes. This may only
  # be set with genesis_url; canonical block-zero authentication still applies.
  genesis_sha256: ""
  genesis_fetch_timeout: 60s
  start_block: 0
  name: Ethereum
  native_symbol: ETH
  native_name: Ether
  native_decimals: 18
  max_reorg_depth: 128

database:
  # Supply ETHERVIEW_DATABASE_URL or ETHERVIEW_DATABASE_URL_FILE at runtime.
  url: ""
  # Supply optional replica credentials through
  # ETHERVIEW_DATABASE_READ_URL or ETHERVIEW_DATABASE_READ_URL_FILE.
  # A reader URL or either non-zero reader size enables a separate API read-only
  # pool. An empty URL uses the writer endpoint; zero sizes inherit the writer
  # bounds. With all three settings empty/zero, reads share the writer pool.
  read_url: ""
  read_max_connections: 0
  read_min_connections: 0
  max_connections: 20
  min_connections: 2
  connect_timeout: 10s
  statement_timeout: 30s

rpc:
  request_timeout: 20s
  batch_size: 100
  # Supply comma-separated all-purpose URLs or a structured JSON endpoint array
  # through ETHERVIEW_RPC_URLS at runtime. Keep every URL in a Secret.
  endpoints: []

runtime:
  roles: [all]
  poll_interval: 2s
  worker_count: 4
  backfill_workers: 4
  backfill_batch_blocks: 256
  lease_duration: 30s

mempool:
  poll_interval: 3s
  retention: 10m
  max_transactions: 50000
  max_response_bytes: 16777216

maintenance:
  interval: 15m
  search_retention_generations: 100000
  adapter_delete_batch: 1000

observability:
  environment: production
  log_level: info
  log_format: json
  # Supply ETHERVIEW_OTLP_TRACE_ENDPOINT at runtime to enable OTLP/HTTP traces.
  # The endpoint is an origin; Etherview sends protobuf spans to /v1/traces.
  otlp_trace_endpoint: ""
  # Required only for an explicitly trusted plain-HTTP collector.
  otlp_trace_insecure: false
  trace_sample_ratio: 0.1
  trace_export_timeout: 5s
  metrics_refresh_interval: 15s

metadata:
  fetch_timeout: 10s
  # JSON is stored in PostgreSQL and is hard-capped at 2 MiB by the schema.
  max_document_bytes: 2097152
  max_redirects: 3
  # Optional HTTPS gateway for ipfs:// resources. DNS/IP safety checks are
  # applied after every resolution and redirect; credentials are forbidden.
  ipfs_gateway: ""

features:
  trace: false
  mempool: false
  historical_state: false
  verification: false
  sourcify: false
  nft_metadata: false
  pricing: false
  user_auth: false
  x402_billing: false

security:
  public_verification: false
  compiler_sandbox: disabled
  # Supply ETHERVIEW_API_KEY_PEPPER or ETHERVIEW_API_KEY_PEPPER_FILE. The
  # value must contain at least 32 bytes and is never returned by the API.
  api_key_pepper: ""
  anonymous_rate: 5
  anonymous_burst: 20
  allowed_origins: []
  trusted_proxies: []

# Wallet authentication requires server.public_url to be a root HTTPS origin.
# Plain HTTP is accepted only for a loopback development origin. Supply the
# session pepper through ETHERVIEW_SESSION_PEPPER(_FILE), never through YAML.
user_auth:
  challenge_ttl: 5m
  session_ttl: 168h
  last_used_interval: 5m
  max_message_bytes: 4096
  max_signature_bytes: 65

# x402 v2 exact-EVM billing is disabled until explicitly enabled and at least
# one eligible operation is listed below. The facilitator is a fixed HTTPS
# origin whose DNS answers must remain inside these canonical CIDRs. Supply
# ETHERVIEW_X402_FINGERPRINT_PEPPER(_FILE) and optional
# ETHERVIEW_X402_FACILITATOR_HEADERS(_FILE) only to all/api processes.
billing:
  facilitator_url: ""
  facilitator_allowed_cidrs: []
  facilitator_timeout: 10s
  facilitator_max_response_bytes: 1048576
  network: ""
  asset: ""
  asset_decimals: 0
  asset_eip712_name: ""
  asset_eip712_version: ""
  recipient: ""
  requirement_max_timeout: 60s
  reservation_ttl: 2m
  max_payment_header_bytes: 16384
  max_buffered_response_bytes: 8388608
  max_captured_header_bytes: 65536
  coarse_ip_rate: 100
  coarse_ip_burst: 200
  routes: {}

verification:
  max_input_bytes: 5242880
  max_output_bytes: 67108864
  timeout: 2m
  cache_directory: /var/lib/etherview/compilers
  container_runtime: docker
  container_memory: 512m
  container_cpus: "1"
  container_pids: 64
  # Public verification requires pre-pulled digest-pinned images. Startup
  # inspects every image and compilation never pulls, for example:
  # images:
  #   solidity:
  #     "0.8.30": ghcr.io/example/solc@sha256:<64 hex characters>
  images: {}
  # HTTPS + lowercase non-zero SHA-256 artifacts are private process mode only.
  # Each entry may set max_bytes; omission uses the fixed 200 MiB limit.
  artifacts: {}

# Optional Sourcify v2 interoperability. Set ETHERVIEW_FEATURE_SOURCIFY=true
# only with authenticated public verification enabled. API-role processes use
# the restricted, redirect-free outbound client; verification workers do not.
sourcify:
  base_url: https://sourcify.dev/server
  timeout: 20s
  max_request_bytes: 5242880
  max_response_bytes: 33554432

# Optional accelerators and external enrichment sources. Empty values are the
# normal PostgreSQL-only monolith configuration.
adapters:
  namespace: etherview
  nats_url: ""
  redis_url: ""
  connect_timeout: 2s
  operation_timeout: 500ms
  redis_cache_ttl: 30s
  s3_endpoint: ""
  s3_bucket: ""
  s3_prefix: etherview
  s3_region: ""
  # Supply credentials through ETHERVIEW_S3_ACCESS_KEY(_FILE),
  # ETHERVIEW_S3_SECRET_KEY(_FILE), and optional S3_SESSION_TOKEN(_FILE).
  s3_access_key: ""
  s3_secret_key: ""
  s3_session_token: ""
  s3_path_style: false
  s3_max_object_bytes: 16777216
  price_base_url: ""
  name_base_url: ""
  fetch_timeout: 5s
  max_response_bytes: 1048576
  max_redirects: 2
  price_freshness: 5m
  name_freshness: 24h
  failure_ttl: 30s
