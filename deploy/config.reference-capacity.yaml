# P60 reproducible starting profile for the core explorer read mix. Supply the
# database URL, chain identity, and structured RPC endpoint Secret through
# ETHERVIEW_* environment inputs. This file is not a P70 release benchmark
# result and deliberately contains no credentials.
server:
  address: 0.0.0.0:8080
  metrics_address: 0.0.0.0:9090
  # Set a root HTTPS origin before enabling user authentication.
  public_url: ""
  shutdown_timeout: 30s
  read_timeout: 10s
  write_timeout: 30s

database:
  url: ""
  # Supply the optional reader URL through ETHERVIEW_DATABASE_READ_URL or its
  # _FILE variant. A URL or non-zero reader size enables an API-only read pool;
  # an empty URL uses the writer endpoint and zero sizes inherit writer bounds.
  # Account for both pools when it is enabled.
  read_url: ""
  read_max_connections: 0
  read_min_connections: 0
  max_connections: 12
  min_connections: 2
  connect_timeout: 5s
  statement_timeout: 15s

rpc:
  request_timeout: 10s
  batch_size: 100
  endpoints: []

runtime:
  roles: [all]
  poll_interval: 500ms
  worker_count: 4
  backfill_workers: 8
  backfill_batch_blocks: 64
  lease_duration: 30s

observability:
  environment: capacity
  log_level: info
  log_format: json
  trace_sample_ratio: 0.01
  metrics_refresh_interval: 5s
  sync_progress_log_interval: 30s

features:
  trace: false
  mempool: false
  historical_state: false
  verification: false
  sourcify: false
  nft_metadata: false
  pricing: false
  user_auth: false
  user_api_keys: false
  x402_billing: false
  proxy_detection_v2: false
  safe_proxy_detection: false
  diamond_proxy_detection: false
  proxy_detection_v2_public: false

security:
  public_verification: false
  # High anonymous limits are appropriate only on an isolated benchmark
  # ingress. A production-like test should use an API key with a named quota.
  anonymous_rate: 1000
  anonymous_burst: 2000
  trusted_proxies: []

user_auth:
  challenge_ttl: 5m
  session_ttl: 168h
  last_used_interval: 5m
  max_message_bytes: 4096
  max_signature_bytes: 65
  api_key_rate: 20
  api_key_burst: 40
  max_active_api_keys: 5

billing:
  facilitator_url: ""
  facilitator_allowed_cidrs: []
  facilitator_timeout: 10s
  facilitator_max_response_bytes: 1048576
  network: ""
  asset: ""
  asset_decimals: 0
  asset_eip712_name: ""
  asset_eip712_version: ""
  recipient: ""
  requirement_max_timeout: 60s
  reservation_ttl: 2m
  max_payment_header_bytes: 16384
  max_buffered_response_bytes: 8388608
  max_captured_header_bytes: 65536
  coarse_ip_rate: 100
  coarse_ip_burst: 200
  routes: {}

adapters:
  namespace: etherview
  connect_timeout: 500ms
  operation_timeout: 100ms
  redis_cache_ttl: 15s
