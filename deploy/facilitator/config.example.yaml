# Replace example identities and destinations before deployment.
server:
  listen: 0.0.0.0:8081
  tls_cert_file: /etc/etherview/certs/tls.crt
  tls_key_file: /run/secrets/facilitator-tls-key
# These file references are fallbacks. Omit database/auth when supplying
# X402_DATABASE_URL or X402_DATABASE_URL_FILE and
# X402_BEARER_TOKEN or X402_BEARER_TOKEN_FILE to the facilitator process.
database:
  url_file: /run/secrets/facilitator-database-url
auth:
  bearer_token_file: /run/secrets/facilitator-bearer-token
signers:
  local:
    type: keystore
    address: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
    keystore_file: /run/secrets/facilitator-keystore
    password_file: /run/secrets/facilitator-password
  managed:
    type: aws_kms
    address: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
    region: us-east-1
    key_arn: arn:aws:kms:us-east-1:123456789012:key/replace-with-key-id
chains:
  - network: eip155:11155111
    rpc:
      url_file: /run/secrets/sepolia-rpc-url
    signer: local
    max_gas: 500000
    max_fee_per_gas: "100000000000"
    confirmations: 2
    recipients: ["0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"]
    tokens:
      - address: "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238"
        methods: [eip3009, permit2]
  - network: eip155:84532
    rpc:
      url_file: /run/secrets/base-sepolia-rpc-url
    signer: managed
    max_gas: 500000
    max_fee_per_gas: "100000000000"
    confirmations: 2
    recipients: ["0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"]
    tokens:
      # Placeholder: replace with the reviewed token deployed on this network.
      - address: "0x1111111111111111111111111111111111111111"
        methods: [eip3009, permit2]
