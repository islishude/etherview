{{- if not .Values.secretName }}{{ fail "secretName is required" }}{{ end }}
{{- if not .Values.egressCIDRs }}{{ fail "egressCIDRs is required" }}{{ end }}
{{- if .Values.config.server.allow_insecure_http }}{{ fail "production TLS is required" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  annotations: {{ toYaml .Values.serviceAccountAnnotations | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  facilitator.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      terminationGracePeriodSeconds: 35
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532}
      containers:
        - name: facilitator
          image: {{ .Values.image | quote }}
          command: ["/x402facilitator"]
          args: [--config=/etc/etherview/facilitator.yaml]
          {{- with .Values.secretEnv }}
          env:
            {{- range $name, $secret := . }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.name | quote }}
                  key: {{ $secret.key | quote }}
            {{- end }}
          {{- end }}
          ports: [{name: https, containerPort: 8081}]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
          volumeMounts:
            - {name: config, mountPath: /etc/etherview, readOnly: true}
            - {name: certificate, mountPath: /etc/etherview/certs, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}}
        - name: certificate
          configMap: {name: {{ .Values.certificateConfigMapName }}}
        - name: secrets
          secret: {secretName: {{ .Values.secretName }}, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app: {{ .Release.Name }}}
  ports: [{name: https, port: 443, targetPort: https}]
  # Keep healthy chains reachable when another chain makes /readyz degraded.
  publishNotReadyAddresses: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {etherview-facilitator-client: "true"}
      ports: [{port: 8081, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- range .Values.egressCIDRs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{port: 443, protocol: TCP}, {port: 5432, protocol: TCP}]
    {{- end }}
