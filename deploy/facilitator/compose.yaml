services:
  x402-facilitator:
    image: etherview-x402-facilitator:local
    build:
      context: ../..
      dockerfile: deploy/facilitator/Dockerfile
    command: [--config=/etc/etherview/facilitator.yaml]
    volumes:
      - ./config.yaml:/etc/etherview/facilitator.yaml:ro
      - ./secrets:/run/secrets:ro
    expose: [8081]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 35s
