events {}
http {
  server {
    listen 127.0.0.1:8081;
    location = /health { return 200 "ready\n"; }
  }
  server {
    listen 8443 ssl;
    server_name ipfs.preview.test;
    ssl_certificate /run/ipfs-tls/tls.crt;
    ssl_certificate_key /run/ipfs-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /ipfs/ {
      limit_except GET HEAD { deny all; }
      proxy_pass http://ipfs:8080;
      proxy_set_header Host ipfs.preview.test;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
      proxy_buffering off;
    }
    location / { return 404; }
  }
}
