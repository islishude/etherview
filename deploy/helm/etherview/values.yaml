nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/islishude/etherview
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Optional authoritative Genesis JSON source. Configure either a read-only PVC
# or a public HTTPS URL. Source settings are exposed only to monolith/sync Pods;
# API and worker Pods read imported facts from PostgreSQL.
genesisState:
  existingClaim: ""
  key: genesis.json
  mountPath: /var/lib/etherview/genesis.json
  url: ""
  sha256: ""
  fetchTimeout: 60s

# Disposable, checksum-addressed solc-js artifacts. This memory-backed volume
# is mounted only into the all/api application container.
compilerCache:
  sizeLimit: 256Mi

# monolith runs only the `all` deployment. distributed runs every enabled
# non-all role from the same image and component implementations.
mode: monolith

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

roles:
  all:
    enabled: true
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
  api:
    enabled: true
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
  sync:
    enabled: true
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 70
  enrich:
    enabled: true
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 8
      targetCPUUtilizationPercentage: 75
  trace:
    enabled: true
    replicas: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 8
      targetCPUUtilizationPercentage: 75
  metadata:
    enabled: true
    replicas: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
  maintenance:
    enabled: true
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 2Gi

deploymentStrategy:
  maxSurge: "25%"
  maxUnavailable: "25%"

# Disabled by default because a single-replica development release would make
# voluntary disruption impossible. HA profiles enable this only after raising
# every selected role to at least two replicas.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# When enabled, render one component-scoped constraint per selected role.
# minDomains=2 plus DoNotSchedule prevents an HA replica set from silently
# collapsing onto one eligible node. This generated constraint is mutually
# exclusive with the legacy free-form topologySpreadConstraints list.
roleTopologySpread:
  enabled: false
  maxSkew: 1
  minDomains: 2
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: explorer.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Optional TLS on the Go API listener itself. This is independent of
# ingress.tls, which controls the client-to-Ingress hop. The named Secret must
# already exist and is mounted only into all/api application containers.
apiTLS:
  enabled: false
  existingSecret: ""
  certificateKey: tls.crt
  privateKeyKey: tls.key

migration:
  enabled: true
  backoffLimit: 4
  activeDeadlineSeconds: 600
  # Keep completed revision Jobs long enough for operator inspection without
  # accumulating one object forever for every Helm upgrade.
  ttlSecondsAfterFinished: 86400

# This Secret is referenced, never rendered by the chart. The included
# ExternalSecret always materializes the writer database, RPC, and API-key
# pepper keys. User-session and x402 keys are included only when their feature
# is enabled; reader and accelerator keys are included only when their optional
# remote-key values below are non-empty.
secrets:
  existingSecret: etherview
  databaseURLKey: database-url
  databaseReadURLKey: database-read-url
  rpcURLsKey: rpc-urls
  apiKeyPepperKey: api-key-pepper
  sessionPepperKey: session-pepper
  x402FingerprintPepperKey: x402-fingerprint-pepper
  x402FacilitatorHeadersKey: x402-facilitator-headers
  natsURLKey: nats-url
  redisURLKey: redis-url
  s3AccessKeyKey: s3-access-key
  s3SecretKeyKey: s3-secret-key
  s3SessionTokenKey: s3-session-token
  otlpTraceEndpointKey: otlp-trace-endpoint
  otlpTraceHeadersKey: otlp-trace-headers

externalSecret:
  enabled: false
  apiVersion: external-secrets.io/v1beta1
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  databaseURLRemoteKey: etherview/database-url
  # Set to materialize the optional database-read-url Secret entry.
  databaseReadURLRemoteKey: ""
  rpcURLsRemoteKey: etherview/rpc-urls
  apiKeyPepperRemoteKey: etherview/api-key-pepper
  # Required when both externalSecret and config.features.user_auth are
  # enabled. It is otherwise neither fetched nor injected.
  sessionPepperRemoteKey: ""
  # Required when ExternalSecret-managed x402 billing is enabled.
  x402FingerprintPepperRemoteKey: ""
  # Optional facilitator credentials; omitted when empty and never fetched
  # while billing is disabled.
  x402FacilitatorHeadersRemoteKey: ""
  # Empty optional remote keys are omitted from the ExternalSecret. Set only
  # the accelerators used by this release.
  natsURLRemoteKey: ""
  redisURLRemoteKey: ""
  s3AccessKeyRemoteKey: ""
  s3SecretKeyRemoteKey: ""
  s3SessionTokenRemoteKey: ""
  otlpTraceEndpointRemoteKey: ""
  otlpTraceHeadersRemoteKey: ""

config:
  server:
    address: 0.0.0.0:8080
    metrics_address: 0.0.0.0:9090
    public_url: ""
    # apiTLS supplies fixed Secret-backed paths through role-scoped
    # environment variables. Keep these ConfigMap values empty.
    tls_cert_file: ""
    tls_key_file: ""
    shutdown_timeout: 20s
    read_timeout: 15s
    write_timeout: 30s
  chain:
    id: 1
    genesis_hash: "0xd4e56740f876aef8c010b86a40d5f56745a118d0906a34e69aec8c0db1cb8fa3"
    # Absolute path to an operator-mounted Genesis JSON, or empty to expose the
    # genesis-account capability as unavailable.
    genesis_file: ""
    # Remote Genesis inputs are injected only into sync-bearing Pods from
    # genesisState. Keep these ConfigMap values empty.
    genesis_url: ""
    genesis_sha256: ""
    genesis_fetch_timeout: 60s
    start_block: 0
    name: Ethereum
    native_symbol: ETH
    native_name: Ether
    native_decimals: 18
    max_reorg_depth: 128
  wallet:
    # Optional public EIP-3085 values. Never place credentials in these URLs.
    add_chain:
      rpc_urls: []
      block_explorer_urls: []
      icon_urls: []
  database:
    url: ""
    # Keep both URLs empty in Helm values. The writer URL and optional reader
    # URL are injected from secrets.existingSecret. A reader URL or either
    # non-zero reader size enables an API-only read pool; an empty URL uses the
    # writer endpoint and zero sizes inherit the writer bounds.
    read_url: ""
    read_max_connections: 0
    read_min_connections: 0
    max_connections: 20
    min_connections: 2
    connect_timeout: 10s
    statement_timeout: 30s
  rpc:
    request_timeout: 20s
    batch_size: 100
    endpoints: []
  runtime:
    roles: [all]
    poll_interval: 2s
    worker_count: 4
    backfill_workers: 4
    backfill_batch_blocks: 256
    lease_duration: 30s
  mempool:
    poll_interval: 3s
    retention: 10m
    max_transactions: 50000
    max_response_bytes: 16777216
  maintenance:
    interval: 15m
    search_retention_generations: 100000
    adapter_delete_batch: 1000
  observability:
    environment: production
    log_level: info
    log_format: json
    # The OTLP endpoint is injected from secrets.existingSecret.
    otlp_trace_endpoint: ""
    otlp_trace_insecure: false
    trace_sample_ratio: 0.1
    trace_export_timeout: 5s
    metrics_refresh_interval: 15s
    sync_progress_log_interval: 30s
  features:
    trace: false
    mempool: false
    historical_state: false
    verification: false
    sourcify: false
    nft_metadata: false
    pricing: false
    user_auth: false
    x402_billing: false
    proxy_detection_v2: false
    safe_proxy_detection: false
    proxy_detection_v2_public: false
  security:
    public_verification: false
    api_key_pepper: ""
    anonymous_rate: 5
    anonymous_burst: 20
    allowed_origins: []
    trusted_proxies: []
  # The session pepper has no values key: it is accepted only from the
  # Secret-backed ETHERVIEW_SESSION_PEPPER environment variable.
  user_auth:
    challenge_ttl: 5m
    session_ttl: 168h
    last_used_interval: 5m
    max_message_bytes: 4096
    max_signature_bytes: 65
  # Fingerprint and facilitator-header secrets have no values keys and are
  # accepted only from API-role Secret-backed environment variables.
  billing:
    facilitator_url: ""
    facilitator_allowed_cidrs: []
    facilitator_timeout: 10s
    facilitator_max_response_bytes: 1048576
    network: ""
    asset: ""
    asset_decimals: 0
    asset_eip712_name: ""
    asset_eip712_version: ""
    recipient: ""
    requirement_max_timeout: 60s
    reservation_ttl: 2m
    max_payment_header_bytes: 16384
    max_buffered_response_bytes: 8388608
    max_captured_header_bytes: 65536
    coarse_ip_rate: 100
    coarse_ip_burst: 200
    routes: {}
  verification:
    max_input_bytes: 5242880
    max_output_bytes: 67108864
    timeout: 2m
    worker_count: 1
    cache_directory: /var/lib/etherview/compilers/cache
    node_path: /usr/local/bin/node
    wrapper_path: /opt/etherview/compiler/compile.mjs
    manifest_path: /opt/etherview/compiler/runtime-manifest.json
    catalog_urls:
      solidity: auto
    allowed_download_origins:
      - https://binaries.soliditylang.org
    catalog_refresh_interval: 1h
    catalog_max_staleness: 24h
  sourcify:
    base_url: https://sourcify.dev/server
    timeout: 20s
    max_request_bytes: 5242880
    max_response_bytes: 33554432
    attempts: 3
    poll_interval: 1s
    max_polls: 120
  adapters:
    namespace: etherview
    nats_url: ""
    redis_url: ""
    connect_timeout: 2s
    operation_timeout: 500ms
    redis_cache_ttl: 30s
    s3_endpoint: ""
    s3_bucket: ""
    s3_prefix: etherview
    s3_region: ""
    # Credentials are injected from secrets.existingSecret and must remain
    # empty in this ConfigMap-backed section.
    s3_access_key: ""
    s3_secret_key: ""
    s3_session_token: ""
    s3_path_style: false
    s3_max_object_bytes: 16777216
    price_base_url: ""
    name_base_url: ""
    fetch_timeout: 5s
    max_response_bytes: 1048576
    max_redirects: 2
    price_freshness: 5m
    name_freshness: 24h
    failure_ttl: 30s

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

prometheusRule:
  enabled: false
  additionalLabels: {}
  syncLagBlocks: 2
  pendingJobs: 1000
  metricsRefreshStaleSeconds: 60
  repairQueueAgeSeconds: 900

networkPolicy:
  enabled: true
  allowExternalHTTPS: true
  # Explicit TCP/443 destinations for RPC and adapter traffic when broad HTTPS
  # is disabled. Keep these ranges disjoint from facilitator_allowed_cidrs.
  runtimeHTTPSCIDRs: []
  # When x402 billing is enabled, every entry must list explicit non-TCP/443
  # ports. Use runtimeHTTPSCIDRs for non-facilitator TCP/443 dependencies.
  additionalEgress: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 30
