config:
  server:
    public_url: https://explorer.example.com
  features:
    user_auth: true
    user_api_keys: true
    api_billing: true
    x402_topups: true
  billing:
    payment_chains:
      - network: eip155:84532
        name: Base Sepolia
        facilitator_url: https://facilitator.example.com
        tokens:
          - id: default
            name: USDC
            credit_rate_numerator: "1"
            credit_rate_denominator: "1"
            asset: "0x1111111111111111111111111111111111111111"
            asset_decimals: 6
            asset_eip712_name: USDC
            asset_eip712_version: "2"
            recipient: "0x2222222222222222222222222222222222222222"
            minimum_topup_amount_atomic: "1"
            maximum_topup_amount_atomic: "1000000"
            asset_transfer_methods: [eip3009, permit2]
    facilitator_allowed_cidrs:
      - 203.0.113.0/24
    base_price_atomic: "1"

networkPolicy:
  allowExternalHTTPS: false
  runtimeHTTPSCIDRs:
    - 198.51.100.0/24
