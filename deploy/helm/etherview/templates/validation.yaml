{{- range $roleName, $role := .Values.roles }}
{{- if and $role.autoscaling.enabled (gt (int $role.autoscaling.minReplicas) (int $role.autoscaling.maxReplicas)) }}
{{- fail (printf "roles.%s.autoscaling.maxReplicas must be greater than or equal to minReplicas" $roleName) }}
{{- end }}
{{- end }}
{{- if .Values.config.security.public_verification }}
{{- if not .Values.config.features.verification }}
{{- fail "config.features.verification must be true when public verification is enabled" }}
{{- end }}
{{- end }}
{{- if .Values.config.features.verification }}
{{- $compilerCacheClaimRaw := .Values.compilerCache.existingClaim }}
{{- $compilerCacheClaim := .Values.compilerCache.existingClaim | trim }}
{{- if or (ne $compilerCacheClaimRaw $compilerCacheClaim) (and (not (empty $compilerCacheClaim)) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $compilerCacheClaim))) }}
{{- fail "compilerCache.existingClaim must be a valid non-empty Kubernetes resource name" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must be true when verification is enabled" }}
{{- end }}
{{- if .Values.networkPolicy.allowExternalHTTPS }}
{{- fail "networkPolicy.allowExternalHTTPS must be false when verification is enabled; the chart grants catalog HTTPS egress only to all/api" }}
{{- end }}
{{- range $runtimeCIDR := .Values.networkPolicy.runtimeHTTPSCIDRs }}
{{- if or (eq $runtimeCIDR "0.0.0.0/0") (eq $runtimeCIDR "::/0") }}
{{- fail "networkPolicy.runtimeHTTPSCIDRs must not contain an internet-wide CIDR when verification is enabled" }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.apiTLS.enabled (empty (.Values.apiTLS.existingSecret | trim)) }}
{{- fail "apiTLS.existingSecret is required when process-native API TLS is enabled" }}
{{- end }}
{{- if and .Values.apiTLS.enabled .Values.config.server.public_url (not (hasPrefix "https://" .Values.config.server.public_url)) }}
{{- fail "config.server.public_url must use HTTPS when apiTLS is enabled" }}
{{- end }}
{{- if and .Values.genesisState.existingClaim (ne (int64 .Values.config.chain.start_block) (int64 0)) }}
{{- fail "genesisState.existingClaim requires config.chain.start_block=0" }}
{{- end }}
{{- $genesisClaim := .Values.genesisState.existingClaim | trim }}
{{- $genesisURL := .Values.genesisState.url | trim }}
{{- $genesisSHA256 := .Values.genesisState.sha256 | trim }}
{{- if and (not (empty $genesisClaim)) (not (empty $genesisURL)) }}
{{- fail "genesisState.existingClaim and genesisState.url are mutually exclusive" }}
{{- end }}
{{- if and (not (empty $genesisURL)) (ne (int64 .Values.config.chain.start_block) (int64 0)) }}
{{- fail "genesisState.url requires config.chain.start_block=0" }}
{{- end }}
{{- if and (not (empty $genesisSHA256)) (empty $genesisURL) }}
{{- fail "genesisState.sha256 requires genesisState.url" }}
{{- end }}
{{- if and (not (empty $genesisURL)) (regexMatch "(?i)/(%2e|\\.){1,2}(/|$)" $genesisURL) }}
{{- fail "genesisState.url must not contain path traversal segments" }}
{{- end }}
{{- if and .Values.prometheusRule.enabled (not .Values.serviceMonitor.enabled) }}
{{- fail "prometheusRule.enabled requires serviceMonitor.enabled so every alert is release-scoped" }}
{{- end }}
{{- $s3Access := .Values.externalSecret.s3AccessKeyRemoteKey | trim }}
{{- $s3Secret := .Values.externalSecret.s3SecretKeyRemoteKey | trim }}
{{- $s3Session := .Values.externalSecret.s3SessionTokenRemoteKey | trim }}
{{- $s3Endpoint := .Values.config.adapters.s3_endpoint | trim }}
{{- if ne (empty $s3Access) (empty $s3Secret) }}
{{- fail "externalSecret S3 access and secret remote keys must be configured together" }}
{{- end }}
{{- if and (not (empty $s3Session)) (empty $s3Access) }}
{{- fail "externalSecret.s3SessionTokenRemoteKey requires the S3 access and secret remote keys" }}
{{- end }}
{{- if and (or (not (empty $s3Access)) (not (empty $s3Secret)) (not (empty $s3Session))) (empty $s3Endpoint) }}
{{- fail "ExternalSecret S3 credential remote keys require config.adapters.s3_endpoint" }}
{{- end }}
{{- if .Values.s3ServiceAccount.enabled }}
{{- if empty $s3Endpoint }}
{{- fail "s3ServiceAccount.enabled requires config.adapters.s3_endpoint" }}
{{- end }}
{{- if and (not .Values.s3ServiceAccount.create) (empty (.Values.s3ServiceAccount.name | trim)) }}
{{- fail "s3ServiceAccount.name is required when s3ServiceAccount.create is false" }}
{{- end }}
{{- if and (not .Values.s3ServiceAccount.create) (not (empty .Values.s3ServiceAccount.annotations)) }}
{{- fail "s3ServiceAccount.annotations require s3ServiceAccount.create" }}
{{- end }}
{{- else }}
{{- if or .Values.s3ServiceAccount.eksPodIdentity (not (empty (.Values.s3ServiceAccount.name | trim))) (not (empty .Values.s3ServiceAccount.annotations)) }}
{{- fail "disabled s3ServiceAccount must not configure a name, annotations, or EKS Pod Identity" }}
{{- end }}
{{- end }}
{{- if or .Values.config.features.user_auth .Values.config.features.x402_topups }}
{{- $publicURL := .Values.config.server.public_url | trim }}
{{- $secureOrigin := regexMatch "^https://([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]|\\[[0-9A-Fa-f:]+\\])(:[1-9][0-9]{0,4})?/?$" $publicURL }}
{{- $loopbackOrigin := regexMatch "^http://(localhost|127\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}|\\[::1\\])(:[1-9][0-9]{0,4})?/?$" $publicURL }}
{{- $portMatch := regexFind ":[1-9][0-9]{0,4}/?$" $publicURL | trimSuffix "/" | trimPrefix ":" }}
{{- $portValid := or (empty $portMatch) (le (atoi $portMatch) 65535) }}
{{- if or (not (or $secureOrigin $loopbackOrigin)) (not $portValid) }}
{{- fail "config.server.public_url must be a root HTTPS origin when user auth or x402 top-ups are enabled (HTTP is allowed only for loopback development)" }}
{{- end }}
{{- end }}
{{- if .Values.config.features.user_auth }}
{{- if and .Values.externalSecret.enabled (empty (.Values.externalSecret.sessionPepperRemoteKey | trim)) }}
{{- fail "externalSecret.sessionPepperRemoteKey is required when ExternalSecret-managed user auth is enabled" }}
{{- end }}
{{- end }}
{{- if .Values.config.features.x402_topups }}
{{- if or (not .Values.config.features.api_billing) (not .Values.config.features.user_auth) (not .Values.config.features.user_api_keys) }}
{{- fail "config.features.x402_topups requires api_billing, user_auth, and user_api_keys" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must be true when x402 top-ups are enabled" }}
{{- end }}
{{- if .Values.networkPolicy.allowExternalHTTPS }}
{{- fail "networkPolicy.allowExternalHTTPS must be false when x402 top-ups are enabled; use facilitator_allowed_cidrs for API-only TCP/443 egress" }}
{{- end }}
{{- $x402AdditionalEgressError := "networkPolicy.additionalEgress must explicitly exclude TCP/443 when x402 top-ups are enabled; use facilitator_allowed_cidrs for API-only TCP/443 egress" }}
{{- range $ruleIndex, $rule := .Values.networkPolicy.additionalEgress }}
{{- if not (kindIs "map" $rule) }}
{{- fail (printf "%s (rule %d is invalid)" $x402AdditionalEgressError $ruleIndex) }}
{{- end }}
{{- if not (hasKey $rule "ports") }}
{{- fail (printf "%s (rule %d omits ports)" $x402AdditionalEgressError $ruleIndex) }}
{{- end }}
{{- $ports := get $rule "ports" }}
{{- if or (not (kindIs "slice" $ports)) (eq (len $ports) 0) }}
{{- fail (printf "%s (rule %d has no explicit ports)" $x402AdditionalEgressError $ruleIndex) }}
{{- end }}
{{- range $portIndex, $portRule := $ports }}
{{- if not (kindIs "map" $portRule) }}
{{- fail (printf "%s (rule %d port %d is invalid)" $x402AdditionalEgressError $ruleIndex $portIndex) }}
{{- end }}
{{- $protocol := "TCP" }}
{{- if hasKey $portRule "protocol" }}
{{- $protocol = upper (toString (get $portRule "protocol")) }}
{{- end }}
{{- if not (has $protocol (list "TCP" "UDP" "SCTP")) }}
{{- fail (printf "%s (rule %d port %d has an invalid protocol)" $x402AdditionalEgressError $ruleIndex $portIndex) }}
{{- end }}
{{- if eq $protocol "TCP" }}
{{- if not (hasKey $portRule "port") }}
{{- fail (printf "%s (rule %d port %d omits the TCP port)" $x402AdditionalEgressError $ruleIndex $portIndex) }}
{{- end }}
{{- $startText := toString (get $portRule "port") }}
{{- if not (regexMatch "^[1-9][0-9]{0,4}$" $startText) }}
{{- fail (printf "%s (rule %d port %d must use a numeric TCP port)" $x402AdditionalEgressError $ruleIndex $portIndex) }}
{{- end }}
{{- $startPort := atoi $startText }}
{{- if gt $startPort 65535 }}
{{- fail (printf "%s (rule %d port %d is outside the TCP port range)" $x402AdditionalEgressError $ruleIndex $portIndex) }}
{{- end }}
{{- $endPort := $startPort }}
{{- if hasKey $portRule "endPort" }}
{{- $endText := toString (get $portRule "endPort") }}
{{- if not (regexMatch "^[1-9][0-9]{0,4}$" $endText) }}
{{- fail (printf "%s (rule %d port %d has an invalid TCP endPort)" $x402AdditionalEgressError $ruleIndex $portIndex) }}
{{- end }}
{{- $endPort = atoi $endText }}
{{- if or (gt $endPort 65535) (lt $endPort $startPort) }}
{{- fail (printf "%s (rule %d port %d has an invalid TCP range)" $x402AdditionalEgressError $ruleIndex $portIndex) }}
{{- end }}
{{- end }}
{{- if and (le $startPort 443) (ge $endPort 443) }}
{{- fail (printf "%s (rule %d port %d includes TCP/443)" $x402AdditionalEgressError $ruleIndex $portIndex) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq (len .Values.config.billing.facilitator_allowed_cidrs) 0 }}
{{- fail "config.billing.facilitator_allowed_cidrs must contain at least one CIDR when x402 top-ups are enabled" }}
{{- end }}
{{- range $runtimeCIDR := .Values.networkPolicy.runtimeHTTPSCIDRs }}
{{- if or (eq $runtimeCIDR "0.0.0.0/0") (eq $runtimeCIDR "::/0") }}
{{- fail "networkPolicy.runtimeHTTPSCIDRs must not contain an internet-wide CIDR when x402 top-ups are enabled" }}
{{- end }}
{{- if has $runtimeCIDR $.Values.config.billing.facilitator_allowed_cidrs }}
{{- fail "networkPolicy.runtimeHTTPSCIDRs must not repeat a facilitator CIDR; facilitator TCP/443 egress is API/all-only" }}
{{- end }}
{{- end }}
{{- $facilitatorURL := .Values.config.billing.facilitator_url | trim }}
{{- $facilitatorOrigin := regexMatch "^https://([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]|\\[[0-9A-Fa-f:]+\\])(:[1-9][0-9]{0,4})?/?$" $facilitatorURL }}
{{- $facilitatorPort := regexFind ":[1-9][0-9]{0,4}/?$" $facilitatorURL | trimSuffix "/" | trimPrefix ":" }}
{{- if or (not $facilitatorOrigin) (and (not (empty $facilitatorPort)) (ne $facilitatorPort "443")) }}
{{- fail "config.billing.facilitator_url must be a root HTTPS origin using the default port or explicit :443 when Helm x402 top-ups are enabled" }}
{{- end }}
{{- if and .Values.externalSecret.enabled (empty (.Values.externalSecret.x402FingerprintPepperRemoteKey | trim)) }}
{{- fail "externalSecret.x402FingerprintPepperRemoteKey is required when ExternalSecret-managed x402 top-ups are enabled" }}
{{- end }}
{{- end }}
{{- $int32Max := int64 2147483647 }}
{{- $databaseMax := int64 .Values.config.database.max_connections }}
{{- $databaseMin := int64 .Values.config.database.min_connections }}
{{- $readMax := int64 .Values.config.database.read_max_connections }}
{{- $readMin := int64 .Values.config.database.read_min_connections }}
{{- if or (lt $databaseMax (int64 1)) (gt $databaseMax $int32Max) (lt $databaseMin (int64 0)) (gt $databaseMin $int32Max) (gt $databaseMin $databaseMax) }}
{{- fail "config.database writer connection bounds must fit int32 and satisfy 0 <= min_connections <= max_connections" }}
{{- end }}
{{- if or (lt $readMax (int64 0)) (gt $readMax $int32Max) (lt $readMin (int64 0)) (gt $readMin $int32Max) }}
{{- fail "config.database reader connection bounds must be zero or a positive int32 value" }}
{{- end }}
{{- $effectiveReadMax := $readMax }}
{{- if eq $effectiveReadMax (int64 0) }}
{{- $effectiveReadMax = $databaseMax }}
{{- end }}
{{- $effectiveReadMin := $readMin }}
{{- if eq $effectiveReadMin (int64 0) }}
{{- $effectiveReadMin = $databaseMin }}
{{- end }}
{{- if gt $effectiveReadMin $effectiveReadMax }}
{{- fail "config.database effective reader min_connections must not exceed effective max_connections" }}
{{- end }}
