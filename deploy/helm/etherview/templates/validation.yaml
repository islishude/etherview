{{- range $roleName, $role := .Values.roles }}
{{- if and $role.autoscaling.enabled (gt (int $role.autoscaling.minReplicas) (int $role.autoscaling.maxReplicas)) }}
{{- fail (printf "roles.%s.autoscaling.maxReplicas must be greater than or equal to minReplicas" $roleName) }}
{{- end }}
{{- end }}
{{- if and .Values.genesisState.existingClaim (ne (int64 .Values.config.chain.start_block) (int64 0)) }}
{{- fail "genesisState.existingClaim requires config.chain.start_block=0" }}
{{- end }}
{{- $genesisClaim := .Values.genesisState.existingClaim | trim }}
{{- $genesisURL := .Values.genesisState.url | trim }}
{{- $genesisSHA256 := .Values.genesisState.sha256 | trim }}
{{- if and (not (empty $genesisClaim)) (not (empty $genesisURL)) }}
{{- fail "genesisState.existingClaim and genesisState.url are mutually exclusive" }}
{{- end }}
{{- if and (not (empty $genesisURL)) (ne (int64 .Values.config.chain.start_block) (int64 0)) }}
{{- fail "genesisState.url requires config.chain.start_block=0" }}
{{- end }}
{{- if and (not (empty $genesisSHA256)) (empty $genesisURL) }}
{{- fail "genesisState.sha256 requires genesisState.url" }}
{{- end }}
{{- if and (not (empty $genesisURL)) (regexMatch "(?i)/(%2e|\\.){1,2}(/|$)" $genesisURL) }}
{{- fail "genesisState.url must not contain path traversal segments" }}
{{- end }}
{{- if and .Values.prometheusRule.enabled (not .Values.serviceMonitor.enabled) }}
{{- fail "prometheusRule.enabled requires serviceMonitor.enabled so every alert is release-scoped" }}
{{- end }}
{{- $s3Access := .Values.externalSecret.s3AccessKeyRemoteKey | trim }}
{{- $s3Secret := .Values.externalSecret.s3SecretKeyRemoteKey | trim }}
{{- $s3Session := .Values.externalSecret.s3SessionTokenRemoteKey | trim }}
{{- if ne (empty $s3Access) (empty $s3Secret) }}
{{- fail "externalSecret S3 access and secret remote keys must be configured together" }}
{{- end }}
{{- if and (not (empty $s3Session)) (empty $s3Access) }}
{{- fail "externalSecret.s3SessionTokenRemoteKey requires the S3 access and secret remote keys" }}
{{- end }}
{{- $int32Max := int64 2147483647 }}
{{- $databaseMax := int64 .Values.config.database.max_connections }}
{{- $databaseMin := int64 .Values.config.database.min_connections }}
{{- $readMax := int64 .Values.config.database.read_max_connections }}
{{- $readMin := int64 .Values.config.database.read_min_connections }}
{{- if or (lt $databaseMax (int64 1)) (gt $databaseMax $int32Max) (lt $databaseMin (int64 0)) (gt $databaseMin $int32Max) (gt $databaseMin $databaseMax) }}
{{- fail "config.database writer connection bounds must fit int32 and satisfy 0 <= min_connections <= max_connections" }}
{{- end }}
{{- if or (lt $readMax (int64 0)) (gt $readMax $int32Max) (lt $readMin (int64 0)) (gt $readMin $int32Max) }}
{{- fail "config.database reader connection bounds must be zero or a positive int32 value" }}
{{- end }}
{{- $effectiveReadMax := $readMax }}
{{- if eq $effectiveReadMax (int64 0) }}
{{- $effectiveReadMax = $databaseMax }}
{{- end }}
{{- $effectiveReadMin := $readMin }}
{{- if eq $effectiveReadMin (int64 0) }}
{{- $effectiveReadMin = $databaseMin }}
{{- end }}
{{- if gt $effectiveReadMin $effectiveReadMax }}
{{- fail "config.database effective reader min_connections must not exceed effective max_connections" }}
{{- end }}
