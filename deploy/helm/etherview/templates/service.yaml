apiVersion: v1
kind: Service
metadata:
  name: {{ include "etherview.fullname" . }}
  labels:
    {{- include "etherview.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ ternary "https" "http" .Values.apiTLS.enabled }}
      port: {{ .Values.service.port }}
      targetPort: {{ ternary "https" "http" .Values.apiTLS.enabled }}
      appProtocol: {{ ternary "https" "http" .Values.apiTLS.enabled }}
      protocol: TCP
  selector:
    {{- include "etherview.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "all" "api" (eq .Values.mode "monolith") }}
