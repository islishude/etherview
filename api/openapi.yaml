          type: integer
          minimum: 1
        burst:
          type: integer
          minimum: 1
        maximum_active:
          type: integer
          minimum: 1
        active_count:
          type: integer
          minimum: 0
        allowed_scopes:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/APIKeyScope"
    UserAPIKeyPage:
