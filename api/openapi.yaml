            $ref: "#/components/schemas/BillingSummaryRow"
    Completeness:
      type: object
      required: [core, trace, metadata, state]
      properties:
        core:
          $ref: "#/components/schemas/StageState"
          description: Current gap-free core indexing readiness.
        trace:
          $ref: "#/components/schemas/StageState"
          description: Published trace@3 state for the exact current canonical indexed block, not a claim of gap-free historical Trace coverage.
        metadata:
          $ref: "#/components/schemas/StageState"
        state:
          $ref: "#/components/schemas/StageState"
          description: Configured historical-state RPC capability; transaction state differences have an independent per-transaction state.
    StageState:
      type: string
      enum: [complete, pending, unavailable, failed]
    Finality:
      type: string
      enum: [pending, latest, safe, finalized, orphan]
    Meta:
      type: object
      required: [request_id, chain_id]
      properties:
        request_id:
          type: string
        chain_id:
          $ref: "#/components/schemas/Quantity"
        next_cursor:
          $ref: "#/components/schemas/OpaqueCursor"
        coverage_start:
          $ref: "#/components/schemas/Quantity"
        coverage_end:
          $ref: "#/components/schemas/Quantity"
    Status:
      type: object
      required: [chain_id, core_ready, latest_block, indexed_block, backfill_complete, lag, completeness]
      properties:
        chain_id:
          $ref: "#/components/schemas/Quantity"
        core_ready:
          type: boolean
        latest_block:
          $ref: "#/components/schemas/Quantity"
        indexed_block:
          $ref: "#/components/schemas/Quantity"
          description: Highest canonical block contiguous from the configured start block.
        highest_covered_block:
          $ref: "#/components/schemas/Quantity"
          description: Highest canonical block stored in any coverage range; absent before the first block is stored.
        backfill_complete:
          type: boolean
          description: Whether canonical coverage is contiguous from the configured start through the latest known head.
        safe_block:
          $ref: "#/components/schemas/Quantity"
        finalized_block:
          $ref: "#/components/schemas/Quantity"
        lag:
          $ref: "#/components/schemas/Quantity"
        completeness:
          $ref: "#/components/schemas/Completeness"
    PublicConfig:
      type: object
      required: [chain_id, chain_name, native_symbol, native_name, native_decimals, features]
      properties:
        chain_id:
          $ref: "#/components/schemas/Quantity"
        chain_name:
          type: string
        native_symbol:
          type: string
        native_name:
          type: string
        native_decimals:
          type: integer
          minimum: 0
          maximum: 255
        wallet_add_chain:
          $ref: "#/components/schemas/WalletAddChainConfig"
        features:
          type: object
          additionalProperties:
            type: boolean
    WalletNativeCurrency:
      type: object
      required: [name, symbol, decimals]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        symbol:
          type: string
          minLength: 2
          maxLength: 6
        decimals:
          type: integer
          minimum: 0
          maximum: 255
    WalletAddChainConfig:
      type: object
      required: [chain_id, chain_name, native_currency, rpc_urls]
      properties:
        chain_id:
          $ref: "#/components/schemas/Quantity"
        chain_name:
          type: string
          minLength: 1
          maxLength: 128
        native_currency:
          $ref: "#/components/schemas/WalletNativeCurrency"
        rpc_urls:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: uri
        block_explorer_urls:
          type: array
          maxItems: 5
          items:
            type: string
            format: uri
        icon_urls:
          type: array
          maxItems: 5
          items:
            type: string
            format: uri
    Block:
      type: object
      required: [hash, number, parent_hash, timestamp, transaction_count, canonical, finality, completeness]
      properties:
        hash:
          $ref: "#/components/schemas/Hash"
        number:
          $ref: "#/components/schemas/Quantity"
        parent_hash:
