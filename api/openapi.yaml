      required:
        - id
        - operation
        - state
        - network
        - asset
        - amount_atomic
        - recipient
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        operation:
          type: string
          minLength: 1
          maxLength: 128
        state:
          $ref: "#/components/schemas/BillingPaymentState"
        network:
          type: string
          pattern: '^eip155:[1-9][0-9]*$'
          maxLength: 96
        asset:
          $ref: "#/components/schemas/Address"
        amount_atomic:
          $ref: "#/components/schemas/Quantity"
        recipient:
