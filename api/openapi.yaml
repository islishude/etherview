components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: X-API-Key
    UserSession:
      type: apiKey
      in: cookie
      name: etherview_session
    X402Payment:
      type: apiKey
      in: header
      name: PAYMENT-SIGNATURE
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        $ref: "#/components/schemas/OpaqueCursor"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ProxyHistoryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TransactionHash:
      name: hash
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Hash"
    Address:
      name: address
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Address"
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    APIKeyPrefix:
      name: prefix
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z2-7]{10}$'
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    PaymentSignature:
      name: PAYMENT-SIGNATURE
      in: header
      description: A single x402 v2 exact-EVM payment payload for this canonical resource.
      schema:
        type: string
        minLength: 1
        maxLength: 16384
    BillingStateFilter:
      name: state
      in: query
      schema:
        $ref: "#/components/schemas/BillingPaymentState"
    BillingOperationFilter:
      name: operation
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 128
    BillingNetworkFilter:
      name: network
      in: query
      schema:
        type: string
        pattern: '^eip155:[1-9][0-9]*$'
        maxLength: 96
    BillingAssetFilter:
      name: asset
      in: query
      schema:
        $ref: "#/components/schemas/Address"
    BillingFromTime:
      name: from_time
      in: query
      description: Inclusive lower time bound. Summary requests default to 24 hours before to_time.
      schema:
        type: string
        format: date-time
    BillingToTime:
      name: to_time
      in: query
      description: Exclusive upper time bound, defaulting to the current server time.
      schema:
        type: string
        format: date-time
  headers:
    PaymentRequired:
      description: Base64-encoded x402 v2 payment requirements for the canonical resource.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 16384
    PaymentResponse:
      description: Base64-encoded x402 v2 settlement response released only after durable settlement.
      schema:
        type: string
        minLength: 1
        maxLength: 16384
  responses:
    VerificationAccepted:
      description: Verifier job accepted for asynchronous execution.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VerificationJobResponse"
    Error:
      description: Machine-readable error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequired:
      description: Payment is required for the selected operation and canonical resource.
      headers:
        PAYMENT-REQUIRED:
          $ref: "#/components/headers/PaymentRequired"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Hash:
      type: string
      pattern: '^0x[0-9a-fA-F]{64}$'
      description: A 32-byte hash; responses use normalized lowercase hexadecimal.
    Address:
      type: string
      pattern: '^0x[0-9a-fA-F]{40}$'
      description: A 20-byte address; responses use the EIP-55 checksum form.
    Quantity:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      maxLength: 78
      description: A uint256 in the inclusive range 0 through 2^256-1, serialized as a canonical decimal string.
    BillingAggregateQuantity:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      maxLength: 97
      description: A canonical non-negative decimal integer used for billing sums and counts that may exceed one uint256.
    Decimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{0,17}[1-9])?$'
      maxLength: 97
      description: A canonical non-negative fixed-point decimal with at most 18 fractional digits.
    SignedDecimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{0,17}[1-9])?$'
      maxLength: 98
      description: A canonical signed fixed-point decimal with at most 18 fractional digits.
    OpaqueCursor:
      type: string
      minLength: 1
      maxLength: 1024
      description: A bounded server-issued traversal token that clients must not decode or construct.
    UserRole:
      type: string
      enum: [user, admin]
    UserStatus:
      type: string
      enum: [active, disabled]
