openapi: 3.0.3
info:
  title: Etherview API
  version: 0.1.0
  description: Versioned native API for a single-chain Etherview deployment.
servers:
  - url: /api/v1
paths:
  /status:
    get:
      operationId: getStatus
      tags: [system]
      responses:
        "200":
          description: Current indexing and capability status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        default:
          $ref: "#/components/responses/Error"
  /config:
    get:
      operationId: getPublicConfig
      tags: [system]
      responses:
        "200":
          description: Public, non-secret deployment configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfigResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/challenge:
    post:
      operationId: createAuthChallenge
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChallengeRequest"
      responses:
        "201":
          description: A short-lived server-authored SIWE message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallengeResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/verify:
    post:
      operationId: verifyAuthChallenge
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerifyRequest"
      responses:
        "201":
          description: Authenticated user session.
          headers:
            Set-Cookie:
              description: HttpOnly SameSite session Cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [authentication]
      responses:
        "200":
          description: Current authenticated session, or an unauthenticated state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logoutAuthSession
      tags: [authentication]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The current session is revoked and its Cookie is cleared.
        default:
          $ref: "#/components/responses/Error"
  /users/me:
    patch:
      operationId: updateCurrentUser
      tags: [users]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          $ref: "#/components/responses/Error"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [users, admin]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Chain-scoped users ordered newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        default:
          $ref: "#/components/responses/Error"
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [users, admin]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated target user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          $ref: "#/components/responses/Error"
  /admin/users/{id}/sessions/revoke:
    post:
      operationId: revokeAdminUserSessions
      tags: [users, admin]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: All active sessions for the target user are revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocationResponse"
        default:
          $ref: "#/components/responses/Error"
  /billing/config:
    get:
      operationId: getBillingConfig
      tags: [billing]
      responses:
        "200":
          description: Public x402 protocol and route-price configuration without facilitator details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingConfigResponse"
        default:
          $ref: "#/components/responses/Error"
  /billing/payments:
    get:
      operationId: listCurrentUserBillingPayments
      tags: [billing]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Payments already attributed to the current authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPaymentListResponse"
        default:
          $ref: "#/components/responses/Error"
  /admin/billing/payments:
    get:
      operationId: listAdminBillingPayments
      tags: [billing, admin]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/BillingStateFilter"
        - $ref: "#/components/parameters/BillingOperationFilter"
        - $ref: "#/components/parameters/BillingNetworkFilter"
        - $ref: "#/components/parameters/BillingAssetFilter"
        - $ref: "#/components/parameters/BillingFromTime"
        - $ref: "#/components/parameters/BillingToTime"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Administrator payment ledger view with writer-authoritative filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPaymentListResponse"
        default:
          $ref: "#/components/responses/Error"
  /admin/billing/summary:
    get:
      operationId: getAdminBillingSummary
      tags: [billing, admin]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/BillingStateFilter"
        - $ref: "#/components/parameters/BillingOperationFilter"
        - $ref: "#/components/parameters/BillingNetworkFilter"
        - $ref: "#/components/parameters/BillingAssetFilter"
        - $ref: "#/components/parameters/BillingFromTime"
        - $ref: "#/components/parameters/BillingToTime"
      responses:
        "200":
          description: Administrator billing totals for a bounded interval, defaulting to the last 24 hours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSummaryResponse"
        default:
          $ref: "#/components/responses/Error"
  /blocks:
    get:
      operationId: listBlocks
      tags: [blocks]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical blocks ordered newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /blocks/{id}:
    get:
      operationId: getBlock
      tags: [blocks]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - name: id
          in: path
          required: true
          description: Decimal/hex block number or 32-byte block hash.
          schema:
            type: string
            format: block-identifier
      responses:
        "200":
          description: Block selected by canonical height or exact hash.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /genesis/accounts:
    get:
      operationId: listGenesisAccounts
      tags: [blocks, addresses]
      description: Accounts authenticated by the canonical block-zero state root.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Genesis allocation accounts ordered by address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenesisAccountListResponse"
        default:
          $ref: "#/components/responses/Error"
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical transactions ordered by block and transaction index, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}:
    get:
      operationId: getTransaction
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
      responses:
        "200":
          description: Transaction and current inclusion.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /pending:
    get:
      operationId: listPendingTransactions
      tags: [transactions]
      description: Transactions from one immutable, successfully polled pending-block snapshot.
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pending transactions ordered by first-seen time and hash, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingTransactionListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}/trace:
    get:
      operationId: getTransactionTrace
      tags: [transactions, traces]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
      responses:
        "200":
          description: Normalized canonical transaction call tree.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionTraceResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}/token-transfers:
    get:
      operationId: listTransactionTokenTransfers
      tags: [transactions, tokens]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Token events for the resolved transaction inclusion.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionTokenTransferResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}/logs:
    get:
      operationId: listTransactionLogs
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Raw receipt logs for the resolved transaction inclusion.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionLogResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}/state-changes:
    get:
      operationId: listTransactionStateChanges
      tags: [transactions, traces]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Exact published account and storage changes for the resolved transaction inclusion.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStateChangeResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}:
    get:
      operationId: getAddress
      tags: [addresses]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Address summary at one canonical block.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/transactions:
    get:
      operationId: listAddressTransactions
      tags: [addresses, transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical top-level transactions involving the address, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/internal-transactions:
    get:
      operationId: listAddressInternalTransactions
      tags: [addresses, transactions, traces]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical non-root trace frames involving the address, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressInternalTransactionListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/erc20-transfers:
    get:
      operationId: listAddressERC20Transfers
      tags: [addresses, tokens, transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical ERC-20 transfers involving the address, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressTokenTransferListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/nft-transfers:
    get:
      operationId: listAddressNFTTransfers
      tags: [addresses, tokens, nfts, transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical ERC-721 and ERC-1155 transfers involving the address, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressTokenTransferListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/nfts:
    get:
      operationId: listAddressNFTBalances
      tags: [addresses, tokens, nfts]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Positive canonical ERC-721/ERC-1155 balances for an owner.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NFTBalanceListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Discovered token contracts at a stable canonical snapshot.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /tokens/{address}:
    get:
      operationId: getToken
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: A discovered token contract and metadata state.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /tokens/{address}/transfers:
    get:
      operationId: listTokenTransfers
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical token events ordered newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenEventListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /nfts/{address}/{token_id}:
    get:
      operationId: getNFTOwner
      tags: [tokens, nfts]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - name: token_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Quantity"
      responses:
        "200":
          description: Canonical NFT ownership or balance for one token instance.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NFTOwnershipResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /nfts/{address}/{token_id}/media:
    get:
      operationId: getNFTMedia
      tags: [tokens, nfts]
      description: >-
        Fetches the image URI selected only from the current canonical, available
        PostgreSQL NFT metadata document and returns a freshly retrieved,
        byte-signature-verified image. The upstream URI is never accepted from
        the request or exposed in the response, media is never persisted, and
        every response is no-store. A valid API key is always required; a
        deployment without configured API-key authentication cannot expose the
        media proxy anonymously.
      security:
        - APIKey: []
      parameters:
        - $ref: "#/components/parameters/Address"
        - name: token_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Quantity"
      responses:
        "200":
          description: Freshly fetched PNG, JPEG, GIF, WebP, or AVIF image.
          headers:
            Cache-Control:
              description: Always `no-store, max-age=0`.
              schema:
                type: string
            Content-Disposition:
              description: Fixed safe inline filename derived only from the validated media type.
              schema:
                type: string
            Content-Security-Policy:
              description: Restrictive policy for an untrusted binary response.
              schema:
                type: string
            X-Content-Type-Options:
              description: Always `nosniff`.
              schema:
                type: string
            X-Etherview-Media-State:
              description: Always `available` for a successful response.
              schema:
                type: string
                enum: [available]
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/avif:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /stats/blocks:
    get:
      operationId: getBlockStats
      tags: [stats]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - name: from_block
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Quantity"
        - name: to_block
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Quantity"
      responses:
        "200":
          description: Complete canonical per-block statistics for a closed range.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockStatListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /stats/summary:
    get:
      operationId: getAggregateStats
      tags: [stats]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - name: from_block
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Quantity"
        - name: to_block
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Quantity"
      responses:
        "200":
          description: Canonical aggregate statistics with explicit range completeness.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregateStatsResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /search:
    get:
      operationId: search
      tags: [search]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - name: q
          in: query
          required: true
          x-etherview-trim-space: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/SearchLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Ranked, non-auto-redirecting search results.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /events:
    get:
      operationId: streamHeadEvents
      tags: [system]
      description: >-
        Server-sent head, reorganization, and sync status events with bounded
        replay from the durable PostgreSQL event ledger. Last-Event-ID resumes
        within the retained durable range; malformed, expired, and future cursor
        values return a typed 400 error, while replay backend failures return a
        typed 503 error.
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /verification/jobs:
    post:
      operationId: submitVerificationJob
      tags: [verification]
      security:
        - APIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationSubmission"
      responses:
        "202":
          description: Verification job accepted for asynchronous execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationJobResponse"
        "200":
          description: An equivalent verification job already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationJobResponse"
        default:
          $ref: "#/components/responses/Error"
  /verification/jobs/{id}:
    get:
      operationId: getVerificationJob
      tags: [verification]
      security:
        - APIKey: []
        - X402Payment: []
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current verification job state.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationJobResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /contracts/{address}/verification:
    get:
      operationId: getVerifiedContract
      tags: [contracts, verification]
      security:
        - APIKey: []
        - X402Payment: []
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - name: code_hash
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Hash"
      responses:
        "200":
          description: Verified contract artifact bound to the requested code hash.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedContractResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /sourcify/contracts/{address}:
    get:
      operationId: lookupSourcifyContract
      tags: [contracts, verification, sourcify]
      description: >-
        Looks up the configured chain and address through the optional Sourcify
        adapter. The response is a bounded, validated summary and is not local
        verification or publication evidence.
      security:
        - APIKey: []
        - X402Payment: []
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Validated Sourcify contract summary.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcifyContractResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /sourcify/imports:
    post:
      operationId: importSourcifyContract
      tags: [contracts, verification, sourcify]
      description: >-
        Resolves the address to the newest exact canonical code and creation
        facts on this server's configured chain, then imports Sourcify compiler
        input only after its runtime identity matches that local target. The
        imported input enters the normal durable local verification pipeline
        and never opts in to a later Sourcify upload.
      security:
        - APIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcifyImportRequest"
      responses:
        "202":
          description: Imported verification job accepted for local execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationJobResponse"
        "200":
          description: An equivalent local verification job already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationJobResponse"
        default:
          $ref: "#/components/responses/Error"
  /verification/jobs/{id}/sourcify:
    post:
      operationId: uploadVerificationJobToSourcify
      tags: [verification, sourcify]
      description: >-
        Uploads the compiler input from a durable local verification job. Both
        its stored submit_to_sourcify opt-in and this call's explicit consent
        must be true. A successful response contains the external job ticket.
      security:
        - APIKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Durable local verification job ID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcifyUploadRequest"
      responses:
        "202":
          description: Sourcify accepted the upload and returned an external ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcifyTicketResponse"
        default:
          $ref: "#/components/responses/Error"
  /sourcify/jobs/{verification_id}:
    get:
      operationId: getSourcifyJob
      tags: [verification, sourcify]
      description: >-
        Returns the validated external Sourcify job state. Upstream diagnostic
        messages and error bodies are never exposed.
      security:
        - APIKey: []
        - X402Payment: []
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - name: verification_id
          in: path
          required: true
          description: Sourcify verification ticket ID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current external verification job state.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcifyJobResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: X-API-Key
    UserSession:
      type: apiKey
      in: cookie
      name: etherview_session
    X402Payment:
      type: apiKey
      in: header
      name: PAYMENT-SIGNATURE
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        $ref: "#/components/schemas/OpaqueCursor"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SearchLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TransactionHash:
      name: hash
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Hash"
    Address:
      name: address
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Address"
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    PaymentSignature:
      name: PAYMENT-SIGNATURE
      in: header
      description: A single x402 v2 exact-EVM payment payload for this canonical resource.
      schema:
        type: string
        minLength: 1
        maxLength: 16384
    BillingStateFilter:
      name: state
      in: query
      schema:
        $ref: "#/components/schemas/BillingPaymentState"
    BillingOperationFilter:
      name: operation
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 128
    BillingNetworkFilter:
      name: network
      in: query
      schema:
        type: string
        pattern: '^eip155:[1-9][0-9]*$'
        maxLength: 96
    BillingAssetFilter:
      name: asset
      in: query
      schema:
        $ref: "#/components/schemas/Address"
    BillingFromTime:
      name: from_time
      in: query
      description: Inclusive lower time bound. Summary requests default to 24 hours before to_time.
      schema:
        type: string
        format: date-time
    BillingToTime:
      name: to_time
      in: query
      description: Exclusive upper time bound, defaulting to the current server time.
      schema:
        type: string
        format: date-time
  headers:
    PaymentRequired:
      description: Base64-encoded x402 v2 payment requirements for the canonical resource.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 16384
    PaymentResponse:
      description: Base64-encoded x402 v2 settlement response released only after durable settlement.
      schema:
        type: string
        minLength: 1
        maxLength: 16384
  responses:
    Error:
      description: Machine-readable error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequired:
      description: Payment is required for the selected operation and canonical resource.
      headers:
        PAYMENT-REQUIRED:
          $ref: "#/components/headers/PaymentRequired"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Hash:
      type: string
      pattern: '^0x[0-9a-fA-F]{64}$'
      description: A 32-byte hash; responses use normalized lowercase hexadecimal.
    Address:
      type: string
      pattern: '^0x[0-9a-fA-F]{40}$'
      description: A 20-byte address; responses use the EIP-55 checksum form.
    Quantity:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      maxLength: 78
      description: A uint256 in the inclusive range 0 through 2^256-1, serialized as a canonical decimal string.
    BillingAggregateQuantity:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      maxLength: 97
      description: A canonical non-negative decimal integer used for billing sums and counts that may exceed one uint256.
    Decimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{0,17}[1-9])?$'
      maxLength: 97
      description: A canonical non-negative fixed-point decimal with at most 18 fractional digits.
    OpaqueCursor:
      type: string
      minLength: 1
      maxLength: 1024
      description: A bounded server-issued traversal token that clients must not decode or construct.
    UserRole:
      type: string
      enum: [user, admin]
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      required:
        - id
        - chain_id
        - address
        - role
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        chain_id:
          $ref: "#/components/schemas/Quantity"
        address:
          $ref: "#/components/schemas/Address"
        display_name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
    AuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address:
          $ref: "#/components/schemas/Address"
    AuthVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, signature]
      properties:
        challenge_id:
          type: string
          format: uuid
        signature:
          type: string
          pattern: '^0x[0-9a-fA-F]{130}$'
    AuthChallenge:
      type: object
      required: [challenge_id, message, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        message:
          type: string
          minLength: 1
          maxLength: 4096
        expires_at:
          type: string
          format: date-time
    AuthSession:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        user:
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
          minLength: 43
          maxLength: 43
    UserProfileUpdate:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
    AdminUserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
    SessionRevocation:
      type: object
      required: [revoked_sessions]
      properties:
        revoked_sessions:
          $ref: "#/components/schemas/Quantity"
    BillingAccess:
      type: string
      enum: [x402, api_key_or_x402]
    BillingPaymentState:
      type: string
      enum: [reserved, verified, settling, settled, failed, expired]
    BillingRoutePrice:
      type: object
      additionalProperties: false
      required: [operation, access, amount_atomic]
      properties:
        operation:
          type: string
          minLength: 1
          maxLength: 128
        access:
          $ref: "#/components/schemas/BillingAccess"
        amount_atomic:
          $ref: "#/components/schemas/Quantity"
    BillingConfig:
      type: object
      additionalProperties: false
      required: [enabled, x402_version, scheme, routes]
      properties:
        enabled:
          type: boolean
        x402_version:
          type: integer
          enum: [2]
        scheme:
          type: string
          enum: [exact]
        network:
          type: string
          pattern: '^eip155:[1-9][0-9]*$'
          maxLength: 96
        asset:
          $ref: "#/components/schemas/Address"
        asset_decimals:
          type: integer
          minimum: 0
          maximum: 255
        asset_eip712_name:
          type: string
          minLength: 1
          maxLength: 128
        asset_eip712_version:
          type: string
          minLength: 1
          maxLength: 32
        recipient:
          $ref: "#/components/schemas/Address"
        routes:
          type: array
          maxItems: 19
          items:
            $ref: "#/components/schemas/BillingRoutePrice"
    BillingPayment:
      type: object
      additionalProperties: false
      required:
        - id
        - operation
        - state
        - network
        - asset
        - amount_atomic
        - recipient
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        operation:
          type: string
          minLength: 1
          maxLength: 128
        state:
          $ref: "#/components/schemas/BillingPaymentState"
        network:
          type: string
          pattern: '^eip155:[1-9][0-9]*$'
          maxLength: 96
        asset:
          $ref: "#/components/schemas/Address"
        amount_atomic:
          $ref: "#/components/schemas/Quantity"
        recipient:
          $ref: "#/components/schemas/Address"
        payer:
          allOf:
            - $ref: "#/components/schemas/Address"
          nullable: true
        user_id:
          type: string
          format: uuid
          nullable: true
        api_key_prefix:
          type: string
          minLength: 10
          maxLength: 10
          nullable: true
        transaction_hash:
          allOf:
            - $ref: "#/components/schemas/Hash"
          nullable: true
        failure_code:
          type: string
          minLength: 1
          maxLength: 128
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        settled_at:
          type: string
          format: date-time
          nullable: true
    BillingSummaryRow:
      type: object
      additionalProperties: false
      required: [state, operation, network, asset, payment_count, amount_atomic]
      properties:
        state:
          $ref: "#/components/schemas/BillingPaymentState"
        operation:
          type: string
          minLength: 1
          maxLength: 128
        network:
          type: string
          pattern: '^eip155:[1-9][0-9]*$'
          maxLength: 96
        asset:
          $ref: "#/components/schemas/Address"
        payment_count:
          $ref: "#/components/schemas/BillingAggregateQuantity"
        amount_atomic:
          $ref: "#/components/schemas/BillingAggregateQuantity"
    BillingSummary:
      type: object
      additionalProperties: false
      required: [from_time, to_time, payment_count, amount_atomic, rows]
      properties:
        from_time:
          type: string
          format: date-time
        to_time:
          type: string
          format: date-time
        payment_count:
          $ref: "#/components/schemas/BillingAggregateQuantity"
        amount_atomic:
          $ref: "#/components/schemas/BillingAggregateQuantity"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BillingSummaryRow"
    Completeness:
      type: object
      required: [core, trace, metadata, state]
      properties:
        core:
          $ref: "#/components/schemas/StageState"
        trace:
          $ref: "#/components/schemas/StageState"
        metadata:
          $ref: "#/components/schemas/StageState"
        state:
          $ref: "#/components/schemas/StageState"
    StageState:
      type: string
      enum: [complete, pending, unavailable, failed]
    Finality:
      type: string
      enum: [pending, latest, safe, finalized, orphan]
    Meta:
      type: object
      required: [request_id, chain_id]
      properties:
        request_id:
          type: string
        chain_id:
          $ref: "#/components/schemas/Quantity"
        next_cursor:
          $ref: "#/components/schemas/OpaqueCursor"
        coverage_start:
          $ref: "#/components/schemas/Quantity"
        coverage_end:
          $ref: "#/components/schemas/Quantity"
    Status:
      type: object
      required: [chain_id, core_ready, latest_block, indexed_block, backfill_complete, lag, completeness]
      properties:
        chain_id:
          $ref: "#/components/schemas/Quantity"
        core_ready:
          type: boolean
        latest_block:
          $ref: "#/components/schemas/Quantity"
        indexed_block:
          $ref: "#/components/schemas/Quantity"
          description: Highest canonical block contiguous from the configured start block.
        highest_covered_block:
          $ref: "#/components/schemas/Quantity"
          description: Highest canonical block stored in any coverage range; absent before the first block is stored.
        backfill_complete:
          type: boolean
          description: Whether canonical coverage is contiguous from the configured start through the latest known head.
        safe_block:
          $ref: "#/components/schemas/Quantity"
        finalized_block:
          $ref: "#/components/schemas/Quantity"
        lag:
          $ref: "#/components/schemas/Quantity"
        completeness:
          $ref: "#/components/schemas/Completeness"
    PublicConfig:
      type: object
      required: [chain_id, chain_name, native_symbol, native_name, native_decimals, features]
      properties:
        chain_id:
          $ref: "#/components/schemas/Quantity"
        chain_name:
          type: string
        native_symbol:
          type: string
        native_name:
          type: string
        native_decimals:
          type: integer
          minimum: 0
          maximum: 255
        features:
          type: object
          additionalProperties:
            type: boolean
    Block:
      type: object
      required: [hash, number, parent_hash, timestamp, transaction_count, canonical, finality, completeness]
      properties:
        hash:
          $ref: "#/components/schemas/Hash"
        number:
          $ref: "#/components/schemas/Quantity"
        parent_hash:
          $ref: "#/components/schemas/Hash"
        timestamp:
          type: string
          format: date-time
        miner:
          $ref: "#/components/schemas/Address"
        transaction_count:
          type: integer
          minimum: 0
        gas_used:
          $ref: "#/components/schemas/Quantity"
        gas_limit:
          $ref: "#/components/schemas/Quantity"
        base_fee_per_gas:
          $ref: "#/components/schemas/Quantity"
        canonical:
          type: boolean
        finality:
          $ref: "#/components/schemas/Finality"
        completeness:
          $ref: "#/components/schemas/Completeness"
    Transaction:
      type: object
      required: [hash, from, nonce, value, gas, input, canonical, finality, completeness]
      properties:
        hash:
          $ref: "#/components/schemas/Hash"
        block_timestamp:
          type: string
          format: date-time
        confirmations:
          $ref: "#/components/schemas/Quantity"
        block_hash:
          $ref: "#/components/schemas/Hash"
        block_number:
          $ref: "#/components/schemas/Quantity"
        transaction_index:
          type: integer
          minimum: 0
        from:
          $ref: "#/components/schemas/Address"
        to:
          $ref: "#/components/schemas/Address"
          nullable: true
        contract_address:
          $ref: "#/components/schemas/Address"
          description: Address created by a successful top-level contract-creation transaction.
        nonce:
          $ref: "#/components/schemas/Quantity"
        value:
          $ref: "#/components/schemas/Quantity"
        gas:
          $ref: "#/components/schemas/Quantity"
        gas_used:
          $ref: "#/components/schemas/Quantity"
        effective_gas_price:
          $ref: "#/components/schemas/Quantity"
          description: "Transaction effective gas price used on-chain (receipt effectiveGasPrice), serialized as wei. For London+ transactions this equals min(baseFeePerGas + tip, gasFeeCap); legacy/access-list transactions use gasPrice."
        tx_fee_wei:
          $ref: "#/components/schemas/Quantity"
          description: "Total fee paid by sender in wei, computed as gas_used * effective_gas_price."
        gas_price:
          $ref: "#/components/schemas/Quantity"
        max_fee_per_gas:
          $ref: "#/components/schemas/Quantity"
        max_priority_fee_per_gas:
          $ref: "#/components/schemas/Quantity"
        burned_wei:
          $ref: "#/components/schemas/Quantity"
          description: "Gas burned by protocol in wei, computed as gas_used * block.base_fee_per_gas. For pre-London blocks this is 0."
        type:
          type: string
        input:
          type: string
          pattern: '^0x[0-9a-fA-F]*$'
        status:
          type: string
          enum: [pending, success, failed, unknown]
        canonical:
          type: boolean
        finality:
          $ref: "#/components/schemas/Finality"
        completeness:
          $ref: "#/components/schemas/Completeness"
    PendingTransaction:
      type: object
      required:
        - hash
        - from
        - nonce
        - value
        - gas
        - input
        - first_seen_at
        - last_seen_at
        - expires_at
        - endpoint
      properties:
        hash:
          $ref: "#/components/schemas/Hash"
        from:
          $ref: "#/components/schemas/Address"
        to:
          $ref: "#/components/schemas/Address"
          nullable: true
        nonce:
          $ref: "#/components/schemas/Quantity"
        value:
          $ref: "#/components/schemas/Quantity"
        gas:
          $ref: "#/components/schemas/Quantity"
        gas_price:
