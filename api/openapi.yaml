          $ref: "#/components/schemas/BillingAccess"
        amount_atomic:
          $ref: "#/components/schemas/Quantity"
    BillingConfig:
      type: object
      additionalProperties: false
      required: [enabled, x402_version, scheme, routes]
      properties:
        enabled:
          type: boolean
        x402_version:
          type: integer
          enum: [2]
        scheme:
          type: string
          enum: [exact]
          x-enum-varnames: [BillingConfigSchemeExact]
        network:
          type: string
          pattern: '^eip155:[1-9][0-9]*$'
          maxLength: 96
        asset:
          $ref: "#/components/schemas/Address"
        asset_decimals:
          type: integer
          minimum: 0
          maximum: 255
        asset_eip712_name:
          type: string
          minLength: 1
          maxLength: 128
        asset_eip712_version:
          type: string
          minLength: 1
          maxLength: 32
        recipient:
          $ref: "#/components/schemas/Address"
        routes:
          type: array
          maxItems: 33
          items:
            $ref: "#/components/schemas/BillingRoutePrice"
    BillingPayment:
      type: object
