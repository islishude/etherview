openapi: 3.0.3
info:
  title: Etherview API
  version: 0.1.0
  description: Versioned native API for a single-chain Etherview deployment.
servers:
  - url: /api/v1
paths:
  /status:
    get:
      operationId: getStatus
      tags: [system]
      responses:
        "200":
          description: Current indexing and capability status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        default:
          $ref: "#/components/responses/Error"
  /config:
    get:
      operationId: getPublicConfig
      tags: [system]
      responses:
        "200":
          description: Public, non-secret deployment configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfigResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/challenge:
    post:
      operationId: createAuthChallenge
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChallengeRequest"
      responses:
        "201":
          description: A short-lived server-authored SIWE message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallengeResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/verify:
    post:
      operationId: verifyAuthChallenge
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerifyRequest"
      responses:
        "201":
          description: Authenticated user session.
          headers:
            Set-Cookie:
              description: HttpOnly SameSite session Cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [authentication]
      responses:
        "200":
          description: Current authenticated session, or an unauthenticated state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logoutAuthSession
      tags: [authentication]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The current session is revoked and its Cookie is cleared.
        default:
          $ref: "#/components/responses/Error"
  /users/me:
    patch:
      operationId: updateCurrentUser
      tags: [users]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          $ref: "#/components/responses/Error"
  /users/me/api-keys:
    get:
      operationId: listCurrentUserAPIKeys
      tags: [users, api-keys]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Current user's API keys and deployment-owned issuance policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIKeyPageResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCurrentUserAPIKey
      tags: [users, api-keys]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAPIKeyCreateRequest"
      responses:
        "201":
          description: Newly issued API key. The plaintext token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIKeyIssuedResponse"
        default:
          $ref: "#/components/responses/Error"
  /users/me/api-keys/{prefix}/rotate:
    post:
      operationId: rotateCurrentUserAPIKey
      tags: [users, api-keys]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/APIKeyPrefix"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "201":
          description: Atomically rotated API key. The replacement token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIKeyIssuedResponse"
        default:
          $ref: "#/components/responses/Error"
  /users/me/api-keys/{prefix}:
    delete:
      operationId: revokeCurrentUserAPIKey
      tags: [users, api-keys]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/APIKeyPrefix"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: API key revoked, or already revoked.
        default:
          $ref: "#/components/responses/Error"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [users, admin]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Chain-scoped users ordered newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        default:
          $ref: "#/components/responses/Error"
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [users, admin]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated target user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          $ref: "#/components/responses/Error"
  /admin/users/{id}/sessions/revoke:
    post:
      operationId: revokeAdminUserSessions
      tags: [users, admin]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: All active sessions for the target user are revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocationResponse"
        default:
          $ref: "#/components/responses/Error"
  /billing/config:
    get:
      operationId: getBillingConfig
      tags: [billing]
      responses:
        "200":
          description: Public x402 protocol and route-price configuration without facilitator details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingConfigResponse"
        default:
          $ref: "#/components/responses/Error"
  /billing/payments:
    get:
      operationId: listCurrentUserBillingPayments
      tags: [billing]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Payments already attributed to the current authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPaymentListResponse"
        default:
          $ref: "#/components/responses/Error"
  /admin/billing/payments:
    get:
      operationId: listAdminBillingPayments
      tags: [billing, admin]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/BillingStateFilter"
        - $ref: "#/components/parameters/BillingOperationFilter"
        - $ref: "#/components/parameters/BillingNetworkFilter"
        - $ref: "#/components/parameters/BillingAssetFilter"
        - $ref: "#/components/parameters/BillingFromTime"
        - $ref: "#/components/parameters/BillingToTime"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Administrator payment ledger view with writer-authoritative filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPaymentListResponse"
        default:
          $ref: "#/components/responses/Error"
  /admin/billing/summary:
    get:
      operationId: getAdminBillingSummary
      tags: [billing, admin]
      security:
        - UserSession: []
      parameters:
        - $ref: "#/components/parameters/BillingStateFilter"
        - $ref: "#/components/parameters/BillingOperationFilter"
        - $ref: "#/components/parameters/BillingNetworkFilter"
        - $ref: "#/components/parameters/BillingAssetFilter"
        - $ref: "#/components/parameters/BillingFromTime"
        - $ref: "#/components/parameters/BillingToTime"
      responses:
        "200":
          description: Administrator billing totals for a bounded interval, defaulting to the last 24 hours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSummaryResponse"
        default:
          $ref: "#/components/responses/Error"
  /blocks:
    get:
      operationId: listBlocks
      tags: [blocks]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical blocks ordered newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /blocks/{id}:
    get:
      operationId: getBlock
      tags: [blocks]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - name: id
          in: path
          required: true
          description: Decimal/hex block number or 32-byte block hash.
          schema:
            type: string
            format: block-identifier
      responses:
        "200":
          description: Block selected by canonical height or exact hash.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /blocks/{id}/transactions:
    get:
      operationId: listBlockTransactions
      tags: [blocks, transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - name: id
          in: path
          required: true
          description: Decimal/hex block number or 32-byte block hash.
          schema:
            type: string
            format: block-identifier
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Transactions included by the selected exact block identity.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /genesis/accounts:
    get:
      operationId: listGenesisAccounts
      tags: [blocks, addresses]
      description: Accounts authenticated by the canonical block-zero state root.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Genesis allocation accounts ordered by address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenesisAccountListResponse"
        default:
          $ref: "#/components/responses/Error"
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical transactions ordered by block and transaction index, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}:
    get:
      operationId: getTransaction
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
      responses:
        "200":
          description: Included, pending, or directly replaced transaction detail from durable PostgreSQL state.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /pending:
    get:
      operationId: listPendingTransactions
      tags: [transactions]
      description: Transactions from one immutable, successfully polled pending-block snapshot.
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pending transactions ordered by first-seen time and hash, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingTransactionListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}/trace:
    get:
      operationId: getTransactionTrace
      tags: [transactions, traces]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
      responses:
        "200":
          description: Normalized canonical transaction call tree.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionTraceResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}/calldata:
    get:
      operationId: getTransactionCalldata
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
      responses:
        "200":
          description: Exact transaction-time execution identity and calldata decoding.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCalldataResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}/internal-transactions:
    get:
      operationId: listTransactionInternalTransactions
      tags: [transactions, traces]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Successful non-root value-bearing trace frames for the exact transaction inclusion.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionInternalTransactionResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}/token-transfers:
    get:
      operationId: listTransactionTokenTransfers
      tags: [transactions, tokens]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Token events for the resolved transaction inclusion.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionTokenTransferResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}/logs:
    get:
      operationId: listTransactionLogs
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Raw receipt logs for the resolved transaction inclusion.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionLogResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}/state-changes:
    get:
      operationId: listTransactionStateChanges
      tags: [transactions, traces]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Exact published account and storage changes for the resolved transaction inclusion.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStateChangeResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{hash}/authorizations:
    get:
      operationId: listTransactionAuthorizations
      tags: [transactions, state]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/TransactionHash"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Exact EIP-7702 authorization tuples and their transaction-time application outcomes.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionAuthorizationResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}:
    get:
      operationId: getAddress
      tags: [addresses]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Address summary at one canonical block.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/delegations:
    get:
      operationId: listAddressDelegations
      tags: [addresses, state]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical EIP-7702 delegation, redelegation, and clearing history, newest first by numeric block, transaction, and authorization position.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationHistoryResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/delegation:
    get:
      operationId: getAddressDelegation
      tags: [addresses, state]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Writer-authoritative delegation binding at the exact canonical tip.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationBindingResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/transactions:
    get:
      operationId: listAddressTransactions
      tags: [addresses, transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical top-level transactions involving the address, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/withdrawals:
    get:
      operationId: listAddressWithdrawals
      tags: [addresses, blocks]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical withdrawals credited to the address, newest first by numeric withdrawal index.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressWithdrawalListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/internal-transactions:
    get:
      operationId: listAddressInternalTransactions
      tags: [addresses, transactions, traces]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical non-root trace frames involving the address, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressInternalTransactionListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/erc20-transfers:
    get:
      operationId: listAddressERC20Transfers
      tags: [addresses, tokens, transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical ERC-20 transfers involving the address, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressTokenTransferListResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        default:
          $ref: "#/components/responses/Error"
  /addresses/{address}/nft-transfers:
    get:
      operationId: listAddressNFTTransfers
      tags: [addresses, tokens, nfts, transactions]
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical ERC-721 and ERC-1155 transfers involving the address, newest first.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressTokenTransferListResponse"
        "402":
