        nonce:
          $ref: "#/components/schemas/Quantity"
        value:
          $ref: "#/components/schemas/Quantity"
        gas:
          $ref: "#/components/schemas/Quantity"
        gas_used:
          $ref: "#/components/schemas/Quantity"
        base_fee_per_gas:
          $ref: "#/components/schemas/Quantity"
          description: "Base fee from the exact block containing this transaction, serialized as wei. Absent before London or when the containing block has no base-fee field."
        blob_base_fee_per_gas:
          $ref: "#/components/schemas/Quantity"
          description: "Blob base fee authenticated by this blob transaction's receipt blobGasPrice, serialized as wei. Absent for non-blob transactions."
        effective_gas_price:
          $ref: "#/components/schemas/Quantity"
          description: "Transaction effective gas price used on-chain (receipt effectiveGasPrice), serialized as wei. For London+ transactions this equals min(baseFeePerGas + tip, gasFeeCap); legacy/access-list transactions use gasPrice."
        tx_fee_wei:
          $ref: "#/components/schemas/Quantity"
          description: "Total fee paid by sender in wei, computed as gas_used * effective_gas_price."
        gas_price:
          $ref: "#/components/schemas/Quantity"
        max_fee_per_gas:
          $ref: "#/components/schemas/Quantity"
        max_priority_fee_per_gas:
          $ref: "#/components/schemas/Quantity"
        max_fee_per_blob_gas:
          $ref: "#/components/schemas/Quantity"
        access_list:
          type: array
          items:
            $ref: "#/components/schemas/TransactionAccessListEntry"
        blob_versioned_hashes:
          type: array
          items:
            $ref: "#/components/schemas/Hash"
        burned_wei:
          $ref: "#/components/schemas/Quantity"
          description: "Gas burned by protocol in wei, computed as gas_used * block.base_fee_per_gas. For pre-London blocks this is 0."
        type:
