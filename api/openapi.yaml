        input:
          type: string
          pattern: '^0x[0-9a-fA-F]*$'
        method:
          type: string
          maxLength: 4096
          description: >-
            Transaction-list display method. GET /transactions always returns
            this projection; other Transaction-bearing resources may omit it.
        method_signature:
          type: string
          maxLength: 4096
          description: >-
            Full canonical ABI function signature when method came from one
            uniquely decoded published calldata result.
        status:
          type: string
          enum: [pending, success, failed, unknown]
        canonical:
          type: boolean
