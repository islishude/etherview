  /events:
    get:
      operationId: streamHeadEvents
      tags: [system]
      description: >-
        Server-sent head, reorganization, and sync status events with bounded
        replay from the durable PostgreSQL event ledger. Last-Event-ID resumes
        within the retained durable range; malformed, expired, and future cursor
        values return a typed 400 error, while replay backend failures return a
        typed 503 error.
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /home/stream:
    get:
      operationId: streamHomeSnapshots
      tags: [system]
      description: >-
        Server-sent complete home-page snapshots. A subscriber receives the
        current writer-authoritative snapshot immediately and a replacement
        snapshot after committed head, reorganization, or sync-status events.
        Each snapshot event uses the durable runtime-event ID as its SSE id;
        reconnects receive the current snapshot rather than intermediate
        historical snapshots.
      responses:
        "200":
          description: >-
            SSE snapshot stream. Each `snapshot` event's data field is one
            HomeSnapshotResponse JSON object.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/HomeSnapshotResponse"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
