[extend]
useDefault = true

[[allowlists]]
description = "x402 access-policy enum, not a credential"
targetRules = ["generic-api-key"]
regexes = ['''^api_key_or_x402$''']

[[allowlists]]
description = "Helm x402 facilitator Secret key name, not a credential"
targetRules = ["generic-api-key"]
regexes = ['''^x402-facilitator-headers$''']

[[allowlists]]
description = "Ignored mkcert output for the local HTTPS Preview"
paths = ['''^\.local/preview-tls/''']

[[allowlists]]
description = "Deterministic public Anvil fixture identities used only by P73 local E2E"
targetRules = ["generic-api-key"]
paths = [
  '''^e2e/x402local/compose\.yaml$''',
  '''^e2e/x402local/x402_local_test\.go$'''
]

[[allowlists]]
description = "Public block access list commitment in Geth Amsterdam fixture and local probe JSON"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^internal/chainbundle/testdata/amsterdam-block\.json$''',
  '''^\.local/amsterdam-probe/block-(?:0x0|0x1|latest|tx)\.json$'''
]
regexTarget = "match"
regexes = ['''^blockAccessListHash"[ \t]*:[ \t]*"0x[0-9a-f]{64}"$''']
