[extend]
useDefault = true

[[allowlists]]
description = "x402 access-policy enum, not a credential"
targetRules = ["generic-api-key"]
regexes = ['''^api_key_or_x402$''']

[[allowlists]]
description = "Helm x402 facilitator Secret key name, not a credential"
targetRules = ["generic-api-key"]
regexes = ['''^x402-facilitator-headers$''']

[[allowlists]]
description = "Ignored local runtime artifacts"
paths = ['''^\.local/''']

[[allowlists]]
description = "Public Hardhat development signing key for the isolated Preview network"
targetRules = ["generic-api-key"]
paths = ['''^e2e/previewmetadata/network_test\.go$''']
condition = "AND"
regexes = ['''^ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''']

[[allowlists]]
description = "Deterministic public Anvil fixture identities used only by local prepaid billing E2E"
targetRules = ["generic-api-key"]
paths = [
  '''^e2e/x402local/compose\.yaml$''',
  '''^e2e/x402local/x402_local_test\.go$'''
]

[[allowlists]]
description = "Public block access list commitment in Geth Amsterdam fixture"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^internal/chainbundle/testdata/amsterdam-block\.json$''']
regexTarget = "match"
regexes = ['''^blockAccessListHash"[ \t]*:[ \t]*"0x[0-9a-f]{64}"$''']

[[allowlists]]
description = "Public WebSocket sample nonce in the Preview gateway handshake fixture"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^e2e/previewgateway/gateway_test\.go$''']
regexTarget = "match"
regexes = ['''^nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\\r$''']

[[allowlists]]
description = "Exact public development keys and token address for local Preview x402"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^compose\.yaml$''', '''^deploy/preview/x402-init\.sh$''', '''^docs/operations\.md$''']
regexes = [
  '''^ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
  '''^59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d$''',
  '''^0x8464135c8F25Da09e49BC8782676a84730C318bC$'''
]
