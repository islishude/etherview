services:
  x402-facilitator:
    image: ${ETHERVIEW_IMAGE:-etherview:local}
    entrypoint: ["/x402facilitator"]
    command: [--config=/etc/etherview/facilitator.yaml]
    secrets: [x402-db, x402-token, x402-key, x402-password]
    depends_on:
      geth:
        condition: service_started
      reth:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /x402facilitator, --healthcheck=http://127.0.0.1:8081/healthz]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 35s

  reth:
    image: ghcr.io/paradigmxyz/reth:v2.9.0
    user: "0:0"
    entrypoint: [sh, /usr/local/bin/reth-entrypoint.sh]
    healthcheck:
      test: [CMD, bash, /usr/local/bin/reth-healthcheck.sh]
      interval: 2s
      timeout: 5s
      retries: 30
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped
