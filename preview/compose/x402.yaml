services:
  x402-facilitator:
    image: ${ETHERVIEW_IMAGE:-etherview:local}
    entrypoint: ["/x402facilitator"]
    command: [--config=/etc/etherview/facilitator.yaml]
    secrets: [x402-db, x402-token, x402-key, x402-password, x402-geth, x402-anvil]
    depends_on:
      geth:
        condition: service_started
      anvil:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /x402facilitator, --healthcheck=http://127.0.0.1:8081/healthz]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 35s

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.7
    user: "0:0"
    entrypoint: [sh, /usr/local/bin/anvil-entrypoint.sh]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'test -f /data/ready && test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = 31337',
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped
