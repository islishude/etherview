services:
  nats:
    image: nats:2.15-alpine
    restart: unless-stopped

  ipfs:
    image: ipfs/kubo:v0.43.1
    command: ["daemon", "--migrate=false"]
    environment:
      IPFS_PROFILE: server
      IPFS_GATEWAY_NO_FETCH: "false"
    ports:
      - "127.0.0.1:${IPFS_API_PORT:-5001}:5001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ipfs --timeout=5s cat /ipfs/bafybeibnsoufr2renqzsh347nrx54wcubt5lgkeivez63xvivplfwhtpym/metadata.json >/dev/null",
        ]
      interval: 5s
      timeout: 6s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: etherview
      POSTGRES_USER: etherview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etherview-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etherview -d etherview"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  object-storage:
    image: rustfs/rustfs:1.0.4
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-etherview}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-etherview-dev-only}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s
    restart: unless-stopped

  archive-init:
    image: rustfs/rc:v0.1.36
    profiles: ["archive-init"]
    entrypoint: ["/bin/sh", "/archive-init.sh"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-etherview}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-etherview-dev-only}
      PREVIEW_BLOB_READ_SECRET: ${PREVIEW_BLOB_READ_SECRET:-preview-read-dev-only}
      PREVIEW_BLOB_WRITE_SECRET: ${PREVIEW_BLOB_WRITE_SECRET:-preview-write-dev-only}
    depends_on:
      object-storage:
        condition: service_healthy
    restart: "no"

  # Development-only helper; not a core role readiness dependency.
