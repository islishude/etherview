services:
  genesis-verify:
    image: etherview-preview-genesis-verify:local
    build:
      context: ../..
      dockerfile: tools/genesis-verify/Dockerfile
    profiles: ["genesis-verify"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  bundler:
    image: ${PREVIEW_BUNDLER_IMAGE:-alchemyplatform/rundler:v0.11.0}
    user: "1000:1000"
    command:
      - node
      - --node_http
      - http://execution:8545
      - --chain_spec
      - /config/rundler.toml
      - --enabled_entry_points
      - v0.9
      - --rpc.host
      - 0.0.0.0
      - --rpc.port
      - "4337"
      - --rpc.api
      - eth
    environment:
      RUST_LOG: warn
      # Public development identity: mnemonic index 9, prefunded in Preview genesis.
      SIGNER_PRIVATE_KEYS: "2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6"
    depends_on:
      execution:
        condition: service_healthy
    restart: unless-stopped

  execution:
    image: ${PREVIEW_EXECUTION_IMAGE:-ghcr.io/paradigmxyz/reth:v2.9.0}
    user: "0:0"
    entrypoint: [sh, /usr/local/bin/execution-entrypoint.sh]
    ports:
      - "127.0.0.1:${PREVIEW_EXECUTION_HTTP_PORT:-8545}:8545"
      - "127.0.0.1:${PREVIEW_EXECUTION_WS_PORT:-8546}:8546"
    healthcheck:
      test: [CMD, bash, /usr/local/bin/execution-healthcheck.sh]
      interval: 5s
      timeout: 4s
      retries: 36
      start_period: 10s
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped

  lighthouse:
    image: sigp/lighthouse:v8.3.2
    command:
      - lighthouse
      - --testnet-dir=/network
      - bn
      - --datadir=/beacon
      - --execution-endpoint=http://execution:8551
      - --execution-jwt=/run/engine/jwt.hex
      - --http
      - --http-address=0.0.0.0
      - --http-port=5052
      - --disable-upnp
      - --target-peers=0
      - --supernode
      - --prune-blobs=false
      - --allow-insecure-genesis-sync
      - --suggested-fee-recipient=0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266
    ports:
      - "127.0.0.1:${LIGHTHOUSE_HTTP_PORT:-5052}:5052"
    depends_on:
      execution:
        condition: service_started
    restart: unless-stopped

  validator:
    image: sigp/lighthouse:v8.3.2
    entrypoint: ["/bin/sh", "/validator.sh"]
    depends_on:
      lighthouse:
        condition: service_started
    restart: unless-stopped
