services:
  genesis-verify:
    image: etherview-preview-genesis-verify:local
    build:
      context: ../..
      dockerfile: tools/genesis-verify/Dockerfile
    profiles: ["genesis-verify"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  bundler:
    image: ${PREVIEW_BUNDLER_IMAGE:-alchemyplatform/rundler:v0.11.0}
    user: "1000:1000"
    command:
      - node
      - --node_http
      - http://geth:8545
      - --chain_spec
      - /config/rundler.toml
      - --enabled_entry_points
      - v0.9
      - --rpc.host
      - 0.0.0.0
      - --rpc.port
      - "4337"
      - --rpc.api
      - eth
    environment:
      RUST_LOG: warn
      # Public development identity: mnemonic index 9, prefunded in Preview genesis.
      SIGNER_PRIVATE_KEYS: "2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6"
    depends_on:
      geth:
        condition: service_healthy
    restart: unless-stopped

  geth:
    image: ${GETH_IMAGE:-ethereum/client-go:v1.17.10}
    entrypoint: ["/bin/sh", "/usr/local/bin/etherview-geth-entrypoint.sh"]
    command:
      - --networkid=48815
      - --nodiscover
      - --maxpeers=0
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=geth
      - --authrpc.jwtsecret=/run/engine/jwt.hex
      - --syncmode=full
      - --gcmode=archive
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,debug,txpool
      - --http.vhosts=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=eth,net,web3,debug,txpool
    ports:
      - "127.0.0.1:${GETH_HTTP_PORT:-8545}:8545"
      - "127.0.0.1:${GETH_WS_PORT:-8546}:8546"
    healthcheck:
      test: ["CMD", "geth", "attach", "--exec", "eth.blockNumber", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 4s
      retries: 36
      start_period: 10s
    restart: unless-stopped

  lighthouse:
    image: sigp/lighthouse:v8.3.2
    command:
      - lighthouse
      - --testnet-dir=/network
      - bn
      - --datadir=/beacon
      - --execution-endpoint=http://geth:8551
      - --execution-jwt=/run/engine/jwt.hex
      - --http
      - --http-address=0.0.0.0
      - --http-port=5052
      - --disable-upnp
      - --target-peers=0
      - --supernode
      - --prune-blobs=false
      - --allow-insecure-genesis-sync
      - --suggested-fee-recipient=0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266
    ports:
      - "127.0.0.1:${LIGHTHOUSE_HTTP_PORT:-5052}:5052"
    depends_on:
      geth:
        condition: service_started
    restart: unless-stopped

  validator:
    image: sigp/lighthouse:v8.3.2
    entrypoint: ["/bin/sh", "/validator.sh"]
    depends_on:
      lighthouse:
        condition: service_started
    restart: unless-stopped
