name: CI runtime acceptance

on:
  workflow_call:
    inputs:
      image-artifact-id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime:
    name: Production schema and runtime E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - uses: ./.github/actions/load-production-image
        with:
          arch: amd64
          image-artifact-id: ${{ inputs.image-artifact-id }}
      - name: Test the production-image PostgreSQL schema lifecycle
        run: make test-schema-e2e-prebuilt
      - name: Test production Compose behavior and topology parity
        id: runtime-e2e
        env:
          RUNTIME_E2E_KEEP_ARTIFACTS: "true"
          TMPDIR: ${{ runner.temp }}
        run: make test-runtime-e2e-prebuilt
      - name: Upload runtime E2E failure diagnostics
        if: ${{ always() && steps.runtime-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etherview-runtime-e2e-*
          if-no-files-found: warn
          retention-days: 7

  preview-metadata:
    name: Preview metadata, consensus, blobs, and manual tools E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PLAYWRIGHT_USE_BUNDLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Use Ubuntu archive mirrors for browser dependencies
        # Slow successful Azure downloads do not trigger APT mirror failover.
        # Keep the runner's official Ubuntu archive and security mirrors.
        run: sudo sed -i '\|://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
      - name: Install Preview browser dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - uses: ./.github/actions/load-production-image
        with:
          arch: amd64
          image-artifact-id: ${{ inputs.image-artifact-id }}
      - name: Install pinned local certificate tool
        run: make install-preview-tools
      - name: Create ephemeral Preview certificates
        env:
          CAROOT: ${{ runner.temp }}/preview-ca
          TRUST_STORES: system
        run: make preview-cert
      - name: Prepare Preview gateway and external images once
        run: make preview-images
      - name: Verify reproducible genesis and controlled contract edge cases
        run: |
          container=$(docker create ghcr.io/foundry-rs/foundry:v1.8.6)
          trap 'docker rm "$container"' EXIT
          mkdir -p "$RUNNER_TEMP/preview-tools"
          docker cp "$container:/usr/local/bin/anvil" "$RUNNER_TEMP/preview-tools/anvil"
          ANVIL="$RUNNER_TEMP/preview-tools/anvil" make preview-contracts-check
          node preview/contracts/upstream.mjs --check
      - name: Validate Caddy gateway boundaries
        run: make test-preview-gateway
      - name: Run full Preview metadata acceptance
        id: preview-metadata
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-preview-metadata-prebuilt
      - name: Run Preview genesis contracts, Bundler and local ENS acceptance
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-preview-contracts-prebuilt
      - name: Run local Preview x402 acceptance
        run: make test-preview-x402-prebuilt
      - name: Run Preview manual tool and browser acceptance
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-preview-tools-e2e-prebuilt
      - name: Run real Preview consensus and blob acceptance
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-preview-consensus-prebuilt
      - name: Upload Preview metadata evidence and diagnostics
        if: ${{ always() && steps.preview-metadata.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etherview-preview-metadata-*
          if-no-files-found: warn
          retention-days: 7
