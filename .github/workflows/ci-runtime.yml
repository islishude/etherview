name: CI runtime acceptance

on:
  workflow_call:
    inputs:
      image-artifact-id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime:
    name: Production schema and runtime E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - uses: ./.github/actions/load-production-image
        with:
          arch: amd64
          image-artifact-id: ${{ inputs.image-artifact-id }}
      - name: Test the production-image PostgreSQL schema lifecycle
        run: make test-schema-e2e-prebuilt
      - name: Test production Compose behavior and topology parity
        id: runtime-e2e
        env:
          RUNTIME_E2E_KEEP_ARTIFACTS: "true"
          TMPDIR: ${{ runner.temp }}
        run: make test-runtime-e2e-prebuilt
      - name: Upload runtime E2E failure diagnostics
        if: ${{ always() && steps.runtime-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etherview-runtime-e2e-*
          if-no-files-found: warn
          retention-days: 7

  preview-smoke:
    name: Preview gateway, genesis, x402, CLI and consensus smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/setup-preview
        id: setup
        with:
          image-artifact-id: ${{ inputs.image-artifact-id }}
      - name: Verify reproducible genesis and controlled contract edge cases
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          container=$(docker create ghcr.io/foundry-rs/foundry:v1.8.7)
          trap 'docker rm "$container"' EXIT
          mkdir -p "$RUNNER_TEMP/preview-tools"
          docker cp "$container:/usr/local/bin/anvil" "$RUNNER_TEMP/preview-tools/anvil"
          docker cp "$container:/usr/local/bin/cast" "$RUNNER_TEMP/preview-tools/cast"
          ANVIL="$RUNNER_TEMP/preview-tools/anvil" CAST="$RUNNER_TEMP/preview-tools/cast" make preview-contracts-check
          node preview/contracts/upstream.mjs --check
      - name: Validate Caddy gateway boundaries
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make test-preview-gateway
      - name: Run Preview x402 E2E
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-preview-x402-prebuilt
      - name: Run Preview CLI smoke E2E
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        id: tools
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-preview-tools-e2e-prebuilt
      - name: Upload Preview tools evidence and diagnostics
        if: ${{ always() && steps.tools.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etherview-preview-metadata-*
          if-no-files-found: warn
          retention-days: 7

      - name: Run Preview consensus and blobs smoke
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        id: consensus
        env:
          TMPDIR: ${{ runner.temp }}/preview-consensus
        run: |
          mkdir -p "$TMPDIR"
          make test-preview-consensus-prebuilt
      - name: Upload Preview consensus evidence and diagnostics
        if: ${{ always() && steps.consensus.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-consensus-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-consensus/etherview-preview-metadata-*
          if-no-files-found: warn
          retention-days: 7

  preview-metadata:
    name: Preview metadata E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_USE_BUNDLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/setup-preview
        with:
          image-artifact-id: ${{ inputs.image-artifact-id }}
          browser: "true"
      - name: Run Preview metadata E2E
        id: acceptance
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-preview-metadata-prebuilt
      - name: Upload Preview metadata evidence and diagnostics
        if: ${{ always() && steps.acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etherview-preview-metadata-*
          if-no-files-found: warn
          retention-days: 7

  preview-contracts:
    name: Preview contracts, Bundler and ENS E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PLAYWRIGHT_USE_BUNDLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/setup-preview
        with:
          image-artifact-id: ${{ inputs.image-artifact-id }}
          browser: "true"
      - name: Run Preview contracts, Bundler and ENS E2E
        id: acceptance
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-preview-contracts-prebuilt
      - name: Upload Preview contracts evidence and diagnostics
        if: ${{ always() && steps.acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etherview-preview-metadata-*
          if-no-files-found: warn
          retention-days: 7
