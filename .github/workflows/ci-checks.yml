name: CI checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Generate and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Run deterministic common gates
        run: make toolchain-check docs-check plan-check generate-check
      - name: Reject unexpected workspace changes
        run: git diff --check && git diff --exit-code

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Run lint checks
        run: make install-lint-tools lint
      - name: Reject unexpected workspace changes
        run: git diff --check && git diff --exit-code

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Install compatible Vyper update test tooling
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: compiler/vyper/pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            compiler/vyper/pyproject.toml
            compiler/vyper/uv.lock
            compiler/vyper/versions/*.lock

      - name: Run tests
        run: make test

      - name: Reject unexpected workspace changes
        run: git diff --check && git diff --exit-code

  test-race:
    name: Test with race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Run race detector tests
        run: make test-race
      - name: Reject unexpected workspace changes
        run: git diff --check && git diff --exit-code

  integration-shards:
    name: PostgreSQL integration (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Run owned PostgreSQL migrations and integration tests
        run: make test-integration INTEGRATION_SHARD=${{ matrix.shard }} INTEGRATION_SHARDS=4
      - name: Verify RustFS S3 transport and persistence
        if: matrix.shard == 1
        run: make test-rustfs

  integration:
    name: PostgreSQL integration
    needs: integration-shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every integration shard and RustFS check
        env:
          RESULT: ${{ needs.integration-shards.result }}
        run: test "$RESULT" = success

  browser:
    name: Embedded SPA browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_USE_BUNDLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Install frontend and browser
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - name: Run embedded-binary browser flows
        run: make test-e2e

  security:
    name: Security and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Install pinned security and license tools
        run: make install-security-tools
      - name: Audit source and dependencies
        run: make security-check license-check

  hardhat3-provider-compat:
    name: Hardhat 3 provider compatibility (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Run provider compatibility regression
        run: make toolchain-check test-hardhat3-provider-compat

  deployment:
    name: Container, Compose, and Helm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: azure/setup-helm@v5
      - name: Validate Dockerfile, Compose profiles, and Helm templates
        run: make deployment-check
