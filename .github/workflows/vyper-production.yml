name: Vyper production fixtures

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      arch:
        required: true
        type: string
      packages-artifact-id:
        required: true
        type: string
    outputs:
      artifact-id:
        description: Exact artifact containing the tested image and matrix evidence
        value: ${{ jobs.fixtures.outputs.artifact-id }}

permissions:
  contents: read

jobs:
  fixtures:
    name: Vyper production fixtures (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.packages-artifact-id }}
          merge-multiple: true
          path: .local/
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          load: true
          tags: etherview:local
          cache-from: type=gha,scope=hardhat3-production-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=hardhat3-production-${{ runner.os }}-${{ runner.arch }},ignore-error=true
      - name: Verify the host-native production image boundary
        run: make docker-image-check
      - parallel:
          - name: Verify production Vyper fixtures (shard 1/4)
            run: node compiler/vyper/wasm/production-matrix.mjs --shard-index 0 --shard-count 4
          - name: Verify production Vyper fixtures (shard 2/4)
            run: node compiler/vyper/wasm/production-matrix.mjs --shard-index 1 --shard-count 4
          - name: Verify production Vyper fixtures (shard 3/4)
            run: node compiler/vyper/wasm/production-matrix.mjs --shard-index 2 --shard-count 4
          - name: Verify production Vyper fixtures (shard 4/4)
            run: node compiler/vyper/wasm/production-matrix.mjs --shard-index 3 --shard-count 4
      - name: Merge production Vyper fixture evidence
        run: node compiler/vyper/wasm/merge-production-matrix.mjs --shard-count 4
      - name: Export tested production image and evidence
        env:
          EXPECTED_ARCH: ${{ inputs.arch }}
          BUNDLE_DIR: ${{ runner.temp }}/vyper-production
        run: node .github/scripts/vyper-production-bundle.mjs save "$BUNDLE_DIR" "$EXPECTED_ARCH"
      - uses: actions/upload-artifact@v7
        id: bundle
        with:
          name: vyper-production-${{ inputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vyper-production/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
