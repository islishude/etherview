name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 08:17 Asia/Shanghai (00:17 UTC).
    - cron: "17 0 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Generate, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            compiler/package-lock.json
            web/package-lock.json

      - name: Install pinned Vyper update test tooling
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: compiler/vyper/pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            compiler/vyper/pyproject.toml
            compiler/vyper/uv.lock
            compiler/vyper/versions/*.lock

      - name: Run deterministic common gates
        run: make install-lint-tools toolchain-check plan-check generate-check lint test test-race

      - name: Reject unexpected workspace changes
        run: git diff --check && git diff --exit-code

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run owned PostgreSQL migrations and integration tests
        run: make test-integration
      - name: Verify RustFS S3 transport and persistence
        run: make test-rustfs

  vyper-packages:
    name: Build application-locked Vyper packages
    outputs:
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build authenticated packages once for both architectures
        run: bash .github/scripts/vyper-ci-packages.sh
      - uses: actions/upload-artifact@v7
        id: packages
        with:
          name: vyper-packages-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          retention-days: 1
          path: |
            .local/vyper-wasm/packages/
            .local/vyper-releases/
          include-hidden-files: true
          if-no-files-found: error

  vyper-runtimes:
    needs: vyper-packages
    name: Vyper native WASM matrix (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.vyper-packages.outputs.artifact-id }}
          merge-multiple: true
          path: .local/
      - name: Build native SEA
        run: bash .github/scripts/vyper-ci-native.sh
      - parallel:
          - name: Verify native Vyper runtime matrix
            env:
              ETHERVIEW_TEST_VYPER_MATRIX_ROOT: ${{ github.workspace }}/.local/vyper-wasm/packages
            run: go test ./internal/verify -run '^TestVyperDynamicRuntimeMatrix$' -timeout=30m
          - name: Verify stable Vyper version matrix
            run: go test ./internal/verify -run '^TestVyperStableVersionMatrix$' -timeout=30m

  hardhat3:
    needs: vyper-packages
    name: Hardhat 3 production verification E2E (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.vyper-packages.outputs.artifact-id }}
          merge-multiple: true
          path: .local/
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/hardhat3/package-lock.json
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          load: true
          tags: etherview:local
          cache-from: type=gha,scope=hardhat3-production-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=hardhat3-production-${{ runner.os }}-${{ runner.arch }},ignore-error=true
      - name: Build the Hardhat test client
        uses: docker/build-push-action@v7
        with:
          context: e2e/hardhat3
          push: false
          load: true
          tags: etherview-hardhat3:local
          cache-from: type=gha,scope=hardhat3-client-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=hardhat3-client-${{ runner.os }}-${{ runner.arch }},ignore-error=true
      - name: Verify the host-native production image boundary
        run: make docker-image-check
      - parallel:
          - name: Verify production Vyper fixtures (shard 1/4)
            run: node compiler/vyper/wasm/production-matrix.mjs --shard-index 0 --shard-count 4
          - name: Verify production Vyper fixtures (shard 2/4)
            run: node compiler/vyper/wasm/production-matrix.mjs --shard-index 1 --shard-count 4
          - name: Verify production Vyper fixtures (shard 3/4)
            run: node compiler/vyper/wasm/production-matrix.mjs --shard-index 2 --shard-count 4
          - name: Verify production Vyper fixtures (shard 4/4)
            run: node compiler/vyper/wasm/production-matrix.mjs --shard-index 3 --shard-count 4
      - name: Merge production Vyper fixture evidence
        run: node compiler/vyper/wasm/merge-production-matrix.mjs --shard-count 4
      - name: Run provider compatibility regression
        run: make toolchain-check test-hardhat3-provider-compat
      - name: Run production Hardhat 3 and proxy verification E2E
        id: hardhat3-e2e
        env:
          RUNTIME_E2E_KEEP_ARTIFACTS: "true"
          TMPDIR: ${{ runner.temp }}
        run: make test-hardhat3-e2e-prebuilt
      - name: Upload native Vyper production acceptance
        uses: actions/upload-artifact@v7
        with:
          name: vyper-acceptance-${{ matrix.arch }}
          path: .local/vyper-releases/acceptance-*.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload Hardhat 3 E2E failure diagnostics
        if: ${{ always() && steps.hardhat3-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: hardhat3-e2e-diagnostics-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etherview-hardhat3-e2e-*
          if-no-files-found: warn
          retention-days: 7

  foundry:
    name: Foundry production verification E2E (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          load: true
          tags: etherview:local
          cache-from: type=gha,scope=foundry-production-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=foundry-production-${{ runner.os }}-${{ runner.arch }},ignore-error=true
      - name: Build the Foundry test client
        uses: docker/build-push-action@v7
        with:
          context: e2e/foundry
          push: false
          load: true
          tags: etherview-foundry:local
          cache-from: type=gha,scope=foundry-client-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=foundry-client-${{ runner.os }}-${{ runner.arch }},ignore-error=true
      - name: Verify the host-native production image boundary
        run: make docker-image-check
      - name: Run production Foundry source verification E2E
        id: foundry-e2e
        env:
          RUNTIME_E2E_KEEP_ARTIFACTS: "true"
          TMPDIR: ${{ runner.temp }}
        run: make test-foundry-e2e-prebuilt
      - name: Upload Foundry E2E failure diagnostics
        if: ${{ always() && steps.foundry-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: foundry-e2e-diagnostics-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etherview-foundry-e2e-*
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Embedded SPA browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_USE_BUNDLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend and browser
        run: |
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps chromium
      - name: Build frontend assets
        run: make web-build
      - name: Run embedded-binary browser flows
        run: make test-e2e

  security:
    name: Security and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            compiler/package-lock.json
            web/package-lock.json
            e2e/hardhat3/package-lock.json
      - name: Install pinned security and license tools
        run: make install-security-tools
      - name: Audit source and dependencies
        run: make security-check license-check

  deployment:
    name: Container, Compose, and Helm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: azure/setup-helm@v5
      - name: Validate Dockerfile, Compose profiles, and Helm templates
        run: make deployment-check
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          load: true
          tags: etherview:local
          cache-from: type=gha,scope=smock-check-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=smock-check-${{ runner.os }}-${{ runner.arch }},ignore-error=true
      - name: Verify the production image boundary
        run: make docker-image-check
      - name: Test the production-image PostgreSQL schema lifecycle
        run: make test-schema-e2e
      - name: Test production Compose behavior and topology parity
        id: runtime-e2e
        env:
          RUNTIME_E2E_KEEP_ARTIFACTS: "true"
          TMPDIR: ${{ runner.temp }}
        run: make test-runtime-e2e-prebuilt
      - name: Upload runtime E2E failure diagnostics
        if: ${{ always() && steps.runtime-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etherview-runtime-e2e-*
          if-no-files-found: warn
          retention-days: 7

  preview-metadata:
    name: Preview IPFS metadata E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install pinned local certificate tool
        run: go install filippo.io/mkcert@v1.4.4
      - name: Create ephemeral Preview certificates
        env:
          CAROOT: ${{ runner.temp }}/preview-ca
          TRUST_STORES: system
        run: bash .github/scripts/preview-ci-certificates.sh
      - name: Run full Preview metadata acceptance
        id: preview-metadata
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-preview-metadata
      - name: Upload Preview metadata evidence and diagnostics
        if: ${{ always() && steps.preview-metadata.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etherview-preview-metadata-*
          if-no-files-found: warn
          retention-days: 7
