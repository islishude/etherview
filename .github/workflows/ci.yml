name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Generate, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run deterministic common gates
        run: make install-lint-tools toolchain-check plan-check generate-check lint test test-race

      - name: Reject unexpected workspace changes
        run: git diff --check && git diff --exit-code

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run owned PostgreSQL migrations and integration tests
        run: make test-integration

  hardhat3:
    name: Hardhat 3 verification compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/hardhat3/package-lock.json
      - name: Run the pinned Hardhat 3 Etherscan-provider flow
        run: make toolchain-check test-hardhat3-verify

  browser:
    name: Embedded SPA browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_USE_BUNDLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend and browser
        run: |
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps chromium
      - name: Build frontend assets
        run: make web-build
      - name: Run embedded-binary browser flows
        run: make test-e2e

  security:
    name: Security and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
            e2e/hardhat3/package-lock.json
      - name: Install pinned security and license tools
        run: make install-security-tools
      - name: Audit source and dependencies
        run: make security-check license-check

  deployment:
    name: Container, Compose, and Helm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: azure/setup-helm@v5
      - name: Validate Dockerfile, Compose profiles, and Helm templates
        run: make deployment-check
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          load: true
          tags: etherview:local
          cache-from: type=gha,scope=smock-check-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=smock-check-${{ runner.os }}-${{ runner.arch }},ignore-error=true
      - name: Verify the production image boundary
        run: make docker-image-check
      - name: Test the production-image PostgreSQL schema lifecycle
        run: make test-schema-e2e
      - name: Test production Compose behavior and topology parity
        run: make test-runtime-e2e
