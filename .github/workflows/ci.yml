name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 08:17 Asia/Shanghai (00:17 UTC).
    - cron: "17 0 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci-checks.yml

  vyper-packages:
    name: Build application-locked Vyper packages
    outputs:
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Build authenticated packages once for both architectures
        run: |
          pnpm --filter ./compiler install --frozen-lockfile
          node compiler/vyper/wasm/prepare.mjs
          node compiler/vyper/wasm/packages.mjs
          node compiler/vyper/wasm/build-release.mjs --output .local/vyper-releases
      - uses: actions/upload-artifact@v7
        id: packages
        with:
          name: vyper-packages-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          retention-days: 1
          path: |
            .local/vyper-wasm/packages/
            .local/vyper-releases/
          include-hidden-files: true
          if-no-files-found: error

  vyper-runtimes:
    needs: vyper-packages
    name: Vyper native WASM matrix (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.vyper-packages.outputs.artifact-id }}
          merge-multiple: true
          path: .local/
      - name: Build native SEA
        run: |
          pnpm --filter ./compiler install --frozen-lockfile
          node compiler/vyper/wasm/prepare.mjs
          pnpm --dir compiler run build:sea "$PWD/.local/vyper-wasm/sea/etherview-solcjs"
      - parallel:
          - name: Verify native Vyper runtime matrix
            env:
              ETHERVIEW_TEST_VYPER_MATRIX_ROOT: ${{ github.workspace }}/.local/vyper-wasm/packages
            run: go test ./internal/verify -run '^TestVyper(DynamicRuntimeMatrix|MatrixSchedulingFailure)$' -count=1 -parallel=4 -v -timeout=30m
          - name: Verify stable Vyper version matrix
            run: go test ./internal/verify -run '^TestVyperStableVersionMatrix$' -count=1 -timeout=30m

  production-image-amd64:
    uses: ./.github/workflows/production-image.yml
    with:
      runner: ubuntu-24.04
      arch: amd64

  production-verification-amd64:
    needs: [vyper-packages, production-image-amd64]
    uses: ./.github/workflows/production-verification.yml
    with:
      runner: ubuntu-24.04
      arch: amd64
      image-identity: ${{ needs.production-image-amd64.outputs.identity }}
      image-artifact-id: ${{ needs.production-image-amd64.outputs.artifact-id }}
      packages-artifact-id: ${{ needs.vyper-packages.outputs.artifact-id }}

  production-image-arm64:
    uses: ./.github/workflows/production-image.yml
    with:
      runner: ubuntu-24.04-arm
      arch: arm64

  production-verification-arm64:
    needs: [vyper-packages, production-image-arm64]
    uses: ./.github/workflows/production-verification.yml
    with:
      runner: ubuntu-24.04-arm
      arch: arm64
      image-identity: ${{ needs.production-image-arm64.outputs.identity }}
      image-artifact-id: ${{ needs.production-image-arm64.outputs.artifact-id }}
      packages-artifact-id: ${{ needs.vyper-packages.outputs.artifact-id }}

  runtime:
    name: Runtime acceptance
    needs: production-image-amd64
    uses: ./.github/workflows/ci-runtime.yml
    with:
      image-artifact-id: ${{ needs.production-image-amd64.outputs.artifact-id }}
