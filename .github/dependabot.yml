version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    # Coordinated updates and reviewed holds: .github/dependency-registry.json.
    ignore:
      - dependency-name: "github.com/fjl/geas"
      - dependency-name: "github.com/holiman/bloomfilter/v2"
      - dependency-name: "github.com/multiformats/go-base36"
      - dependency-name: "go"
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      aws-sdk:
        patterns:
          - "github.com/aws/*"
      golang:
        patterns:
          - "golang.org/*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "02:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    # Coordinated updates and reviewed holds: .github/dependency-registry.json.
    ignore:
      - dependency-name: "license-checker-rseidelsohn"
      - dependency-name: "node"
      - dependency-name: "pnpm"
      - dependency-name: "pyodide"
      - dependency-name: "pyodide-legacy"
      - dependency-name: "solc"
      - dependency-name: "solc-*"
    groups:
      codemirror:
        patterns: ["@codemirror/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      x402:
        patterns: ["@x402/*"]
      react:
        patterns: ["react", "react-*"]
      testing-library:
        patterns: ["@testing-library/*"]
      types:
        patterns: ["@types/*"]
      vitejs:
        patterns: ["vite", "vitest", "@vitejs/*"]
      oxc:
        patterns: ["oxlint", "oxfmt"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-toolchain
      - /.github/actions/load-production-image
      - /.github/actions/prepare-production
    schedule:
      interval: monthly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /e2e/*
    schedule:
      interval: monthly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    # Python changes require coordinated Vyper runtime and lock updates (ADR-0047).
    ignore:
      - dependency-name: "ghcr.io/foundry-rs/foundry"
      - dependency-name: "golang"
      - dependency-name: "node"
      - dependency-name: "python"
    groups:
      container-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories:
      - /
      - /e2e/*
      - /deploy
    schedule:
      interval: monthly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    # These images are built locally rather than published in a registry.
    ignore:
      - dependency-name: "caddy"
      - dependency-name: "ghcr.io/foundry-rs/foundry"
      - dependency-name: "etherview"
      - dependency-name: "etherview-*"
    groups:
      compose-images:
        patterns: ["*"]
