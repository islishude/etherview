version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      aws-sdk:
        patterns:
          - "github.com/aws/*"
      golang:
        patterns:
          - "golang.org/*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
      day: monday
      time: "02:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      codemirror:
        patterns: ["@codemirror/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      x402:
        patterns: ["@x402/*"]
      react:
        patterns: ["react", "react-*"]
      testing-library:
        patterns: ["@testing-library/*"]
      types:
        patterns: ["@types/*"]
      vitejs:
        patterns: ["vite", "vitest", "@vitejs/*"]

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: monthly
      day: monday
      time: "02:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /compiler
    schedule:
      interval: monthly
      day: monday
      time: "02:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      container-images:
        patterns: ["*"]
