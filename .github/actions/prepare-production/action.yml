name: Prepare production verification
description: Download exact packages and load the verified native production image
inputs:
  arch:
    required: true
    description: Native architecture
  image-artifact-id:
    required: true
    description: Exact production image artifact ID
  packages-artifact-id:
    required: true
    description: Exact package artifact ID
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ inputs.packages-artifact-id }}
        merge-multiple: true
        path: .local/
    - uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ inputs.image-artifact-id }}
        merge-multiple: true
        path: .local/production-image/
    - name: Load exact production image
      shell: bash
      env:
        EXPECTED_ARCH: ${{ inputs.arch }}
      run: node .github/scripts/vyper-production-bundle.mjs load ".local/production-image" "$EXPECTED_ARCH"
