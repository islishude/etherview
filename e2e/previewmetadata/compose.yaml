services:
  ipfs:
    command: ["daemon", "--offline", "--migrate=false"]
    environment:
      IPFS_GATEWAY_NO_FETCH: "true"

  postgres:
    ports:
      - target: 5432
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp

  metadata:
    environment:
      ETHERVIEW_LOG_FORMAT: json

  object-storage:
    ports:
      - target: 9000
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp

  bundler:
    ports:
      - target: 4337
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
