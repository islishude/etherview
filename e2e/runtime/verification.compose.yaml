x-verification-environment: &verification-environment
  ETHERVIEW_FEATURE_VERIFICATION: "true"
  ETHERVIEW_PUBLIC_VERIFICATION: "true"
  ETHERVIEW_FEATURE_ENS: "false"
  ETHERVIEW_ENS_RPC_URLS: ""
  ETHERVIEW_POLL_INTERVAL: 2s
  ETHERVIEW_API_KEY_PEPPER: verification-e2e-api-key-pepper-00000000000000000000000000000000
  # CI/local Docker DNS may route reviewed public hosts through a synthetic
  # private address. Origin, TLS, size, and checksum validation remain active.
  ETHERVIEW_VERIFICATION_UNSAFE_ALLOW_PRIVATE_DOWNLOAD_NETWORKS: "true"
  ETHERVIEW_DERIVED_VERIFY_ENABLED: "true"
  ETHERVIEW_DERIVED_VERIFY_BACKFILL_ENABLED: "true"
  ETHERVIEW_DERIVED_VERIFY_FORWARD_ENABLED: "true"

services:
  etherview:
    environment:
      <<: *verification-environment
      ETHERVIEW_ROLES: all

  api:
    environment:
      <<: *verification-environment
      ETHERVIEW_ROLES: api

  sync:
    environment:
      ETHERVIEW_FEATURE_ENS: "false"

  enrich:
    environment:
      ETHERVIEW_FEATURE_ENS: "false"

  trace:
    environment:
      ETHERVIEW_FEATURE_ENS: "false"

  metadata:
    environment:
      ETHERVIEW_FEATURE_ENS: "false"

  maintenance:
    environment:
      ETHERVIEW_FEATURE_ENS: "false"
