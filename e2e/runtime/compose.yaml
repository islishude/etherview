x-runtime-e2e-environment: &runtime-e2e-environment
  ETHERVIEW_RPC_URLS: ${ETHERVIEW_RUNTIME_RPC_URL:-http://runtime-fixture:8545}
  ETHERVIEW_CHAIN_ID: "1"
  ETHERVIEW_API_KEY_PEPPER: ""
  ETHERVIEW_POLL_INTERVAL: 250ms
  ETHERVIEW_SERVER_WRITE_TIMEOUT: ${ETHERVIEW_RUNTIME_SERVER_WRITE_TIMEOUT:-2s}
  ETHERVIEW_MEMPOOL_POLL_INTERVAL: 500ms
  ETHERVIEW_MAINTENANCE_INTERVAL: 1m
  ETHERVIEW_METADATA_IPFS_GATEWAY: ""
  ETHERVIEW_NATS_URL: ""
  ETHERVIEW_REDIS_URL: ""
  ETHERVIEW_S3_ENDPOINT: ""
  ETHERVIEW_S3_BUCKET: ""
  ETHERVIEW_S3_PREFIX: runtime-e2e
  ETHERVIEW_S3_REGION: ""
  ETHERVIEW_S3_ACCESS_KEY: ""
  ETHERVIEW_S3_SECRET_KEY: ""
  ETHERVIEW_S3_SESSION_TOKEN: ""
  ETHERVIEW_S3_PATH_STYLE: "false"
  ETHERVIEW_OTLP_TRACE_ENDPOINT: ""
  ETHERVIEW_OTLP_TRACE_INSECURE: "false"
  ETHERVIEW_TRACE_SAMPLE_RATIO: "0"
  ETHERVIEW_LOG_LEVEL: info
  ETHERVIEW_LOG_FORMAT: json
  ETHERVIEW_ANONYMOUS_RATE: "1000"
  ETHERVIEW_ANONYMOUS_BURST: "2000"
  OTEL_EXPORTER_OTLP_HEADERS: ""
  ETHERVIEW_FEATURE_TRACE: "true"
  ETHERVIEW_FEATURE_MEMPOOL: "true"
  ETHERVIEW_FEATURE_HISTORICAL_STATE: "true"
  ETHERVIEW_FEATURE_NFT_METADATA: "true"
  ETHERVIEW_FEATURE_VERIFICATION: "false"
  ETHERVIEW_PUBLIC_VERIFICATION: "false"
  ETHERVIEW_FEATURE_SOURCIFY: "false"
  ETHERVIEW_FEATURE_PRICING: "false"
  ETHERVIEW_FEATURE_ENS: "true"
  ETHERVIEW_ENS_CUSTOM_REGISTRY: "0xE000000000000000000000000000000000000001"
  ETHERVIEW_ENS_CUSTOM_UNIVERSAL_RESOLVER: "0xE000000000000000000000000000000000000002"
  ETHERVIEW_FEATURE_PROXY_DETECTION_V2: "true"
  ETHERVIEW_FEATURE_SAFE_PROXY_DETECTION: "true"
  ETHERVIEW_FEATURE_DIAMOND_PROXY_DETECTION: "true"
  ETHERVIEW_FEATURE_PROXY_DETECTION_V2_PUBLIC: "true"
  ETHERVIEW_FEATURE_USER_OPERATIONS: ${ETHERVIEW_RUNTIME_FEATURE_USER_OPERATIONS:-false}
  ETHERVIEW_ERC4337_ENTRY_POINTS: ${ETHERVIEW_RUNTIME_ERC4337_ENTRY_POINTS:-[]}

x-runtime-fixture-dependency: &runtime-fixture-dependency
  runtime-fixture:
    condition: service_healthy

services:
  postgres:
    ports:
      - target: 5432
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp

  runtime-fixture:
    image: ${ETHERVIEW_RUNTIME_FIXTURE_IMAGE:-ghcr.io/foundry-rs/foundry:v1.7.1}
    environment:
      ANVIL_ARGS: ${ANVIL_ARGS:-}
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cast", "block-number"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
    entrypoint: ["sh", "-c"]
    command:
      - "anvil --host 0.0.0.0 --port 8545 --chain-id 1 --no-mining ${ANVIL_ARGS}"
    ports:
      - target: 8545
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    restart: "no"

  etherview:
    environment:
      <<: *runtime-e2e-environment
      ETHERVIEW_ENS_RPC_URLS: ${ETHERVIEW_RUNTIME_ENS_RPC_URL:-}
    depends_on: *runtime-fixture-dependency
    extra_hosts: ["host.docker.internal:host-gateway"]

  api:
    environment:
      <<: *runtime-e2e-environment
      ETHERVIEW_ENS_RPC_URLS: ${ETHERVIEW_RUNTIME_ENS_RPC_URL:-}
    depends_on: *runtime-fixture-dependency
    extra_hosts: ["host.docker.internal:host-gateway"]

  sync:
    environment: *runtime-e2e-environment
    depends_on: *runtime-fixture-dependency
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - target: 9090
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp

  enrich:
    environment: *runtime-e2e-environment
    depends_on: *runtime-fixture-dependency
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - target: 9090
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp

  trace:
    environment: *runtime-e2e-environment
    depends_on: *runtime-fixture-dependency
    extra_hosts: ["host.docker.internal:host-gateway"]

  metadata:
    environment: *runtime-e2e-environment
    depends_on: *runtime-fixture-dependency
    extra_hosts: ["host.docker.internal:host-gateway"]

  maintenance:
    environment: *runtime-e2e-environment
    depends_on: *runtime-fixture-dependency
    extra_hosts: ["host.docker.internal:host-gateway"]
