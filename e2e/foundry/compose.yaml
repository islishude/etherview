x-foundry-verification-environment: &foundry-verification-environment
  ETHERVIEW_FEATURE_VERIFICATION: "true"
  ETHERVIEW_PUBLIC_VERIFICATION: "true"
  ETHERVIEW_FEATURE_ENS: "false"
  ETHERVIEW_ENS_RPC_URLS: ""
  ETHERVIEW_POLL_INTERVAL: 2s
  ETHERVIEW_API_KEY_PEPPER: foundry-e2e-api-key-pepper-000000000000000000000000000000000
  # CI/local Docker DNS may route reviewed public hosts through a synthetic
  # private address. Origin, TLS, size, and checksum validation remain active.
  ETHERVIEW_VERIFICATION_UNSAFE_ALLOW_PRIVATE_DOWNLOAD_NETWORKS: "true"

services:
  etherview:
    environment:
      <<: *foundry-verification-environment
      ETHERVIEW_ROLES: all

  api:
    environment:
      <<: *foundry-verification-environment
      ETHERVIEW_ROLES: api

  sync:
    environment:
      ETHERVIEW_FEATURE_ENS: "false"

  enrich:
    environment:
      ETHERVIEW_FEATURE_ENS: "false"

  trace:
    environment:
      ETHERVIEW_FEATURE_ENS: "false"

  metadata:
    environment:
      ETHERVIEW_FEATURE_ENS: "false"

  maintenance:
    environment:
      ETHERVIEW_FEATURE_ENS: "false"

  foundry:
    image: ${ETHERVIEW_FOUNDRY_IMAGE}
    profiles: ["foundry-client"]
    working_dir: /workspace
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ETHERVIEW_FOUNDRY_RPC_URL: http://runtime-fixture:8545
      ETHERVIEW_FOUNDRY_VERIFIER_URL: http://${ETHERVIEW_FOUNDRY_API_SERVICE}:8080/v2/api?chainid=1
      FOUNDRY_OFFLINE: "true"
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
      - /workspace/out:uid=1000,gid=1000,mode=0700
      - /workspace/broadcast:uid=1000,gid=1000,mode=0700
      - /home/foundry/.cache:uid=1000,gid=1000,mode=0700
      - /home/foundry/.foundry:uid=1000,gid=1000,mode=0700
