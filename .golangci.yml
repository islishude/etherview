version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  relative-path-mode: gomod
  tests: true
  build-tags:
    - integration
    - hardhat3verify
    - runtimee2e
    - previewmetadatae2e
    - foundrye2e
    - hardhat3e2e

linters:
  default: standard
  enable:
    - dupl
    - gocognit
    - modernize
    - unparam
    - copyloopvar
    - rowserrcheck
  settings:
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 100
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocognit

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
