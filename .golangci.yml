version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  relative-path-mode: gomod
  tests: true
  build-tags:
    - integration
    - hardhat3verify
    - runtimee2e
    - rustacke2e
    - previewmetadatae2e
    - foundrye2e
    - verificatione2e
    - previewx402e2e
    - previewgatewaye2e
    - rustfs

linters:
  default: standard
  enable:
    - dupl
    - gocognit
    - modernize
    - unparam
    - copyloopvar
    - rowserrcheck
    - depguard
    - forbidigo
    - revive
  settings:
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 2500
              skip-comments: false
              skip-blank-lines: false
    depguard:
      rules:
        native-database:
          deny:
            - pkg: database/sql$
              desc: database access must use native pgx and pgtype contracts
            - pkg: database/sql/driver$
              desc: database access must use native pgx and pgtype contracts
            - pkg: github.com/jackc/pgx/v5/stdlib$
              desc: database access must use native pgx and pgtype contracts
            - pkg: github.com/lib/pq$
              desc: database access must use native pgx and pgtype contracts
        production-fixtures:
          files: ["!$test"]
          deny:
            - pkg: github.com/islishude/etherview/internal/testpgx$
              desc: production code must not import database test fixtures
        public-readers:
          files:
            - "${base-path}/internal/query/**"
            - "${base-path}/internal/state/**"
            - "${base-path}/internal/publicquery/**"
            - "!$test"
          deny:
            - pkg: github.com/islishude/etherview/internal/httpapi$
              desc: public readers must not depend on HTTP transport
        worker-contracts:
          files:
            - "${base-path}/internal/query/**"
            - "${base-path}/internal/publicquery/**"
            - "${base-path}/internal/abicalldata/**"
            - "${base-path}/internal/abicontract/**"
            - "${base-path}/internal/proxycontract/**"
            - "${base-path}/internal/stagecontract/**"
            - "${base-path}/internal/enscontract/**"
            - "!$test"
          deny:
            - pkg: github.com/islishude/etherview/internal/enrich$
              desc: readers and shared contracts must not depend on enrichment workers
            - pkg: github.com/islishude/etherview/internal/enssync$
              desc: readers and shared contracts must use neutral ENS contracts
        database-only-ens-reader:
          files:
            - "${base-path}/internal/ensread/**"
            - "!$test"
          deny:
            - pkg: github.com/islishude/etherview/internal/ens$
              desc: published ENS readers must not resolve names upstream
            - pkg: github.com/islishude/etherview/internal/enssync$
              desc: published ENS readers must not enqueue work
            - pkg: github.com/islishude/etherview/internal/ethrpc$
              desc: published ENS readers must not construct RPC clients
            - pkg: net/http
              desc: published ENS readers must not contact gateways
        neutral-ens-contracts:
          files:
            - "${base-path}/internal/enscontract/**"
            - "!$test"
          deny:
            - pkg: github.com/islishude/etherview/internal/db
              desc: ENS contracts must not depend on persistence implementations
            - pkg: github.com/islishude/etherview/internal/ens$
              desc: ENS contracts must not depend on request-time resolvers
            - pkg: github.com/islishude/etherview/internal/ethrpc$
              desc: ENS contracts must not own RPC clients
            - pkg: github.com/islishude/etherview/internal/httpapi$
              desc: ENS contracts must not depend on HTTP transport
        neutral-public-contracts:
          files:
            - "${base-path}/internal/publicquery/**"
            - "!$test"
          deny:
            - pkg: github.com/islishude/etherview/internal/query$
              desc: public contracts must not depend on reader implementations
            - pkg: github.com/islishude/etherview/internal/state$
              desc: public contracts must not depend on reader implementations
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^(pgx|pgxpool|pgconn)\..*\.(Exec|Query|QueryRow|Prepare|SendBatch|CopyFrom|ExecParams|ExecPrepared|ExecBatch)$'
          pkg: '^github\.com/jackc/pgx/v5(/(pgxpool|pgconn))?$'
          msg: production database execution must use a generated sqlc method
        - pattern: '^(dbgen\.DBTX|dbaccess\.Database|maintenance\.(sessionConnection|nativeSession))\.(Exec|Query|QueryRow)$'
          pkg: '^github\.com/islishude/etherview/internal/(db(/gen)?|maintenance)$'
          msg: production database execution must use a generated sqlc method
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 100
  exclusions:
    generated: strict
    rules:
      # Raw execution is owned by sqlc, tests, migration and partition DDL only.
      - path: '(_test\.go$|^internal/store/(migrate|partition)\.go$)'
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - dupl
          - gocognit

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
