name: etherview-preview

# Host paths stay relative to this entrypoint, including environment overrides.
x-etherview-paths: &etherview-paths
  build:
    context: .
    target: production
    args:
      ETHERVIEW_WEB_BRANDING_DIR: ${ETHERVIEW_WEB_BRANDING_DIR:-web/branding/default}
  volumes:
    - ${ETHERVIEW_CONFIG_FILE:-./preview/config.yaml}:/etc/etherview/config.yaml:ro
    - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/metadata/genesis.json:/config/genesis.json:ro

services:
  nats:
    extends:
      file: preview/compose/storage.yaml
      service: nats

  genesis-verify:
    extends:
      file: preview/compose/chain.yaml
      service: genesis-verify
    volumes:
      - ./preview/verification:/verification:ro
      - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/metadata/genesis.json:/config/genesis.json:ro

  bundler:
    extends:
      file: preview/compose/chain.yaml
      service: bundler
    volumes:
      - ./preview/rundler.toml:/config/rundler.toml:ro

  ipfs:
    extends:
      file: preview/compose/storage.yaml
      service: ipfs
    volumes:
      - ipfs-data:/data/ipfs
      - ./preview/ipfs/init.sh:/container-init.d/010-preview.sh:ro
      - ./e2e/previewmetadata/testdata/metadata.json:/fixtures/metadata.json:ro

  preview-gateway:
    extends:
      file: preview/compose/gateway.yaml
      service: preview-gateway
    volumes:
      - ./preview/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/preview-tls/gateway.crt:/run/preview-tls/gateway.crt:ro
      - ./.local/preview-tls/gateway.key:/run/preview-tls/gateway.key:ro

  postgres:
    extends:
      file: preview/compose/storage.yaml
      service: postgres
    volumes:
      - postgres-data:/var/lib/postgresql

  geth:
    extends:
      file: preview/compose/chain.yaml
      service: geth
    volumes:
      - geth-data:/gethdata
      - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/jwt.hex:/run/engine/jwt.hex:ro
      - ./preview/geth-entrypoint.sh:/usr/local/bin/etherview-geth-entrypoint.sh:ro
      - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/metadata/genesis.json:/config/genesis.json:ro

  lighthouse:
    extends:
      file: preview/compose/chain.yaml
      service: lighthouse
    volumes:
      - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/metadata:/network:ro
      - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/jwt.hex:/run/engine/jwt.hex:ro
      - lighthouse-data:/beacon

  validator:
    extends:
      file: preview/compose/chain.yaml
      service: validator
    volumes:
      - ./preview/validator.sh:/validator.sh:ro
      - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/metadata:/network:ro
      - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/validator:/initial:ro
      - validator-data:/validators

  object-storage:
    extends:
      file: preview/compose/storage.yaml
      service: object-storage
    volumes:
      - blob-data:/data

  archive-init:
    extends:
      file: preview/compose/storage.yaml
      service: archive-init
    volumes:
      - ./preview/archive-init.sh:/archive-init.sh:ro
      - ./preview/read.json:/policies/read.json:ro
      - ./preview/write.json:/policies/write.json:ro

  reth:
    extends:
      file: preview/compose/x402.yaml
      service: reth
    volumes:
      - reth-data:/data
      - ./preview/reth/entrypoint.sh:/usr/local/bin/reth-entrypoint.sh:ro
      - ./preview/reth/healthcheck.sh:/usr/local/bin/reth-healthcheck.sh:ro
      - ./preview/reth/genesis.json:/config/reth-genesis.json:ro

  x402-facilitator:
    extends:
      file: preview/compose/x402.yaml
      service: x402-facilitator
    build:
      context: .
      target: production
      args:
        ETHERVIEW_WEB_BRANDING_DIR: ${ETHERVIEW_WEB_BRANDING_DIR:-web/branding/default}
    volumes:
      - ./preview/facilitator/config.yaml:/etc/etherview/facilitator.yaml:ro

  migration:
    <<: *etherview-paths
    extends:
      file: preview/compose/app.yaml
      service: migration

  api:
    <<: *etherview-paths
    extends:
      file: preview/compose/app.yaml
      service: api

  verification:
    <<: *etherview-paths
    extends:
      file: preview/compose/app.yaml
      service: verification
    volumes:
      - ${ETHERVIEW_CONFIG_FILE:-./preview/config.yaml}:/etc/etherview/config.yaml:ro
      - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/metadata/genesis.json:/config/genesis.json:ro
      - type: bind
        source: ${PREVIEW_COMPILER_CACHE_DIR:-./.local/preview-compilers}
        target: /var/lib/etherview/compilers
        bind:
          create_host_path: false

  sync:
    <<: *etherview-paths
    extends:
      file: preview/compose/app.yaml
      service: sync

  enrich:
    <<: *etherview-paths
    extends:
      file: preview/compose/app.yaml
      service: enrich
    volumes:
      - ${ETHERVIEW_CONFIG_FILE:-./preview/config.yaml}:/etc/etherview/config.yaml:ro
      - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/metadata/genesis.json:/config/genesis.json:ro
      - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/metadata/ens.json:/etc/etherview/ens/current.json:ro

  trace:
    <<: *etherview-paths
    extends:
      file: preview/compose/app.yaml
      service: trace

  metadata:
    <<: *etherview-paths
    extends:
      file: preview/compose/app.yaml
      service: metadata
    volumes:
      - ${ETHERVIEW_CONFIG_FILE:-./preview/config.yaml}:/etc/etherview/config.yaml:ro
      - ${PREVIEW_NETWORK_DIR:-./.local/preview-network}/metadata/genesis.json:/config/genesis.json:ro
      - ./.local/preview-tls/rootCA.pem:/run/ipfs-ca/rootCA.pem:ro

  maintenance:
    <<: *etherview-paths
    extends:
      file: preview/compose/app.yaml
      service: maintenance

volumes:
  ipfs-data:
  postgres-data:
  geth-data:
  reth-data:
  lighthouse-data:
  validator-data:
  blob-data:

secrets:
  x402-db:
    file: ${X402_FACILITATOR_DATABASE_URL_FILE:-./preview/facilitator/database-url}
  x402-token:
    file: ./preview/facilitator/token
  x402-password:
    file: ./preview/facilitator/password
  x402-key:
    file: ./preview/facilitator/keystore.json
