name: etherview

x-app-environment: &app-environment
  ETHERVIEW_DATABASE_URL: postgres://etherview:${POSTGRES_PASSWORD:-etherview-dev-only}@postgres:5432/etherview?sslmode=disable
  ETHERVIEW_DATABASE_READ_URL: ${ETHERVIEW_DATABASE_READ_URL:-}
  # Value-less entries are passed through only when the operator sets them.
  # Omitting them preserves reader-pool sizing from the mounted YAML config.
  ETHERVIEW_DATABASE_READ_MAX_CONNECTIONS:
  ETHERVIEW_DATABASE_READ_MIN_CONNECTIONS:
  ETHERVIEW_RPC_URLS: ${ETHERVIEW_RPC_URLS:-http://host.docker.internal:8545}
  ETHERVIEW_CHAIN_ID: ${ETHERVIEW_CHAIN_ID:-1}
  ETHERVIEW_CHAIN_GENESIS_HASH: ${ETHERVIEW_CHAIN_GENESIS_HASH:-}
  ETHERVIEW_CHAIN_GENESIS_FILE: ${ETHERVIEW_CHAIN_GENESIS_FILE:-}
  ETHERVIEW_CHAIN_GENESIS_URL: ${ETHERVIEW_CHAIN_GENESIS_URL:-}
  ETHERVIEW_CHAIN_GENESIS_SHA256: ${ETHERVIEW_CHAIN_GENESIS_SHA256:-}
  ETHERVIEW_CHAIN_GENESIS_FETCH_TIMEOUT: ${ETHERVIEW_CHAIN_GENESIS_FETCH_TIMEOUT:-60s}
  ETHERVIEW_SERVER_ADDRESS: 0.0.0.0:8080
  ETHERVIEW_SERVER_METRICS_ADDRESS: 0.0.0.0:9090
  # Value-less feature inputs preserve the mounted YAML defaults when unset.
  ETHERVIEW_FEATURE_USER_AUTH:
  ETHERVIEW_FEATURE_X402_BILLING:
  ETHERVIEW_API_KEY_PEPPER: ${ETHERVIEW_API_KEY_PEPPER:-}
  ETHERVIEW_METADATA_IPFS_GATEWAY: ${ETHERVIEW_METADATA_IPFS_GATEWAY:-}
  ETHERVIEW_SOURCIFY_ATTEMPTS:
  ETHERVIEW_SOURCIFY_POLL_INTERVAL:
  ETHERVIEW_SOURCIFY_MAX_POLLS:
  ETHERVIEW_ADAPTER_NAMESPACE: ${ETHERVIEW_ADAPTER_NAMESPACE:-etherview}
  ETHERVIEW_NATS_URL: ${ETHERVIEW_NATS_URL:-}
  ETHERVIEW_REDIS_URL: ${ETHERVIEW_REDIS_URL:-}
  ETHERVIEW_S3_ENDPOINT: ${ETHERVIEW_S3_ENDPOINT:-}
  ETHERVIEW_S3_BUCKET: ${ETHERVIEW_S3_BUCKET:-}
  ETHERVIEW_S3_PREFIX: ${ETHERVIEW_S3_PREFIX:-etherview}
  ETHERVIEW_S3_REGION: ${ETHERVIEW_S3_REGION:-}
  ETHERVIEW_S3_ACCESS_KEY: ${ETHERVIEW_S3_ACCESS_KEY:-}
  ETHERVIEW_S3_SECRET_KEY: ${ETHERVIEW_S3_SECRET_KEY:-}
  ETHERVIEW_S3_SESSION_TOKEN: ${ETHERVIEW_S3_SESSION_TOKEN:-}
  ETHERVIEW_S3_PATH_STYLE: ${ETHERVIEW_S3_PATH_STYLE:-false}
  # Value-less logging inputs preserve the mounted YAML defaults when unset.
  ETHERVIEW_LOG_LEVEL:
  ETHERVIEW_LOG_FORMAT:
  ETHERVIEW_SYNC_PROGRESS_LOG_INTERVAL:
  ETHERVIEW_OTLP_TRACE_ENDPOINT: ${ETHERVIEW_OTLP_TRACE_ENDPOINT:-}
  ETHERVIEW_OTLP_TRACE_INSECURE: ${ETHERVIEW_OTLP_TRACE_INSECURE:-false}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}

x-api-environment: &api-environment
  <<: *app-environment
  # Pass this Secret only to API-capable processes when user auth is enabled.
  # When it is absent from the host/.env, Compose leaves it unset.
  ETHERVIEW_SESSION_PEPPER:
  # x402 secrets have the same API-role boundary and remain absent while the
  # feature is disabled and the operator leaves them unset.
  ETHERVIEW_X402_FINGERPRINT_PEPPER:
  ETHERVIEW_X402_FACILITATOR_HEADERS:
  ETHERVIEW_VERIFICATION_WORKER_COUNT:
  # Trusted runtime path overrides are scoped to the compiler-owning process.
  ETHERVIEW_VERIFICATION_NODE_PATH:
  ETHERVIEW_VERIFICATION_WRAPPER_PATH:
  ETHERVIEW_VERIFICATION_MANIFEST_PATH:

x-app: &app
  image: ${ETHERVIEW_IMAGE:-etherview:local}
  build:
    context: .
    target: production
  environment: *app-environment
  init: true
  restart: unless-stopped
  read_only: true
  user: "65532:65532"
  tmpfs:
    - /tmp:size=64m,mode=1777
  volumes:
    - ${ETHERVIEW_CONFIG_FILE:-./deploy/config.example.yaml}:/etc/etherview/config.yaml:ro
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  depends_on:
    migration:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: etherview
      POSTGRES_USER: etherview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etherview-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etherview -d etherview"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      # PostgreSQL 18 stores version-specific clusters below this mount.
      - postgres-data:/var/lib/postgresql

  migration:
    <<: *app
    command: ["migrate", "up", "--config=/etc/etherview/config.yaml"]
    profiles: ["monolith", "distributed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  etherview:
    <<: *app
    command: ["serve", "--roles=all", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *api-environment
      ETHERVIEW_ROLES: all
    profiles: ["monolith"]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/lib/etherview/compilers:rw,nosuid,nodev,noexec,size=256m,mode=0700,uid=65532,gid=65532
    ports:
      - "${ETHERVIEW_PORT:-8080}:8080"
      - "${ETHERVIEW_METRICS_PORT:-9090}:9090"

  api:
    <<: *app
    command: ["serve", "--roles=api", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *api-environment
      ETHERVIEW_ROLES: api
    profiles: ["distributed"]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/lib/etherview/compilers:rw,nosuid,nodev,noexec,size=256m,mode=0700,uid=65532,gid=65532
    ports:
      - "${ETHERVIEW_PORT:-8080}:8080"
      - "${ETHERVIEW_METRICS_PORT:-9090}:9090"

  sync:
    <<: *app
    command: ["serve", "--roles=sync", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *app-environment
      ETHERVIEW_ROLES: sync
    profiles: ["distributed"]

  enrich:
    <<: *app
    command: ["serve", "--roles=enrich", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *app-environment
      ETHERVIEW_ROLES: enrich
    profiles: ["distributed"]

  trace:
    <<: *app
    command: ["serve", "--roles=trace", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *app-environment
      ETHERVIEW_ROLES: trace
    profiles: ["distributed"]

  metadata:
    <<: *app
    command:
      ["serve", "--roles=metadata", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *app-environment
      ETHERVIEW_ROLES: metadata
    profiles: ["distributed"]

  maintenance:
    <<: *app
    command:
      ["serve", "--roles=maintenance", "--config=/etc/etherview/config.yaml"]
    environment:
      <<: *app-environment
      ETHERVIEW_ROLES: maintenance
    profiles: ["distributed"]

  nats:
    image: nats:2.12-alpine
    command: ["--jetstream", "--store_dir=/data"]
    profiles: ["accelerators"]
    restart: unless-stopped
    volumes:
      - nats-data:/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    profiles: ["accelerators"]
    restart: unless-stopped

  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    profiles: ["accelerators"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-etherview}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-etherview-dev-only}
    restart: unless-stopped
    volumes:
      - object-data:/data

volumes:
  postgres-data:
  nats-data:
  object-data:
