packages:
  - api
  - web
  - compiler
  - e2e/hardhat3
  - deploy/preview/contracts

engineStrict: true
ignoreScripts: true
# Required peers are explicit dependencies. Safe is used only for artifacts,
# so its unused Ethers v5 peer must not be installed.
autoInstallPeers: false
strictPeerDependencies: false

overrides:
  brace-expansion: 5.0.12
  "@hey-api/json-schema-ref-parser>js-yaml": 4.3.2
  tmp: 0.2.7
  adm-zip: 0.6.1
  zod: 4.6.6
