packages:
  - api
  - web
  - compiler
  - e2e/hardhat3
  - preview/contracts

engineStrict: true
# Use the installed pnpm when it satisfies engines.pnpm; CI pins packageManager.
pmOnFail: ignore
ignoreScripts: true
# Required peers are explicit dependencies. Safe is used only for artifacts,
# so its unused Ethers v5 peer must not be installed.
autoInstallPeers: false
strictPeerDependencies: false

overrides:
  brace-expansion: 5.0.12
  "@hey-api/json-schema-ref-parser>js-yaml": 4.3.2
  tmp: 0.2.7
  adm-zip: 0.6.1
  zod: 4.6.6
  # GHSA-3g3m-2fjr-6pw4 and GHSA-g3hv-75wg-m249: checker transitive dependencies.
  "glob@>=9.0.0 <14.0.2": 14.0.4
  "minimatch@>=7.0.0 <11.0.1": 11.0.5
